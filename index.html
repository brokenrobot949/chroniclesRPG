const GEAR_UPGRADE_LINES = [
  "{name} finds {item} — it outclasses the {old} and takes its place.",
  "{Item} turns out to be the better piece. The {old} doesn't get a say in the matter.",
  "{name} weighs {item} against the {old} for about as long as it takes to decide. The {old} loses.",
  "The {old} served well enough. {item} serves better, and {name} makes the swap without ceremony.",
  "{name} finds {item}, and the {old} is retired on the spot.",
  "{Item} is a clear step up from the {old}, and {name} doesn't waste time saying goodbye to it.",
  "{name} trades up — {item} in, the {old} out, no regrets either way.",
  "The {old} has done its work. {item} does more, and {name} makes the change without looking back.",
  "{name} finds {item}, and just like that the {old} is yesterday's problem.",
  "{Item} settles into place like it was always meant to replace the {old}.",
];
// Rarer phrasing for epic/legendary finds — already imp:2 (a bordered card in
// the chronicle), so the language earns the extra weight.
const GEAR_FIRST_LINES_RARE = [
  "{name} finds {item}, and it feels like the road just tipped in their favor.",
  "{Item} — {name} can hardly believe the find, and doesn't waste time putting it to use.",
  "{name} arms themselves with {item}, and for the first time in a while the odds feel less lopsided.",
];
const GEAR_UPGRADE_LINES_RARE = [
  "{name} finds {item} — the kind of find that doesn't happen twice in a lifetime — and the {old} is retired without a second thought.",
  "{Item}. {name} actually stops for a moment before setting the {old} aside for good.",
  "{name} finds {item}, and even the road seems to notice. The {old}'s work is finally done.",
  "There's a weight to {item} that the {old} never had. {name} feels the difference before the next task even starts.",
  "{Item} is the kind of thing songs get written about, if anyone's left to write them. {name} takes it, and the {old} steps down.",
];

function rollDrop(S){
  const h = S.hero;
  const d = derived(h, S.gear);
  if (rng() >= d.dropChance) return;
  const item = generateItem(S.world.zone, null, false, d.dropTierBump, undefined, archetypeForClass(h.cls));
  S.stats.itemsFound++;
  if (item.tier === "legendary" && S._meta) unlockAchievement(S._meta, "legendaryFound", S);
  const equipped = S.gear[item.slot];
  if (!equipped || item.score > equipped.score){
    equipItem(S, item);
    const rare = (item.tier === "epic" || item.tier === "legendary");
    const imp = rare ? 2 : 1;
    const vars = {name: h.name, item: itemPhrase(item), Item: cap(itemPhrase(item)),
                  old: equipped ? equipped.name : ""};
    const pool = equipped
      ? (rare ? GEAR_UPGRADE_LINES_RARE : GEAR_UPGRADE_LINES)
      : (rare ? GEAR_FIRST_LINES_RARE : GEAR_FIRST_LINES);
    const text = fillTemplate(hashPick(pool, h.name + "#" + item.name + "#" + item.slot), vars);
    logEvent(S, "gear", text, imp);
    return;
  }
  S.inventory.push(item);
}

// The single item worth remembering a hero by — used at death to snapshot
// what goes into their grave as a possible heirloom (see renderDeath's "Lay
// Them to Rest" handler). Ties broken by slot order; doesn't matter which.
function bestGearItem(gear){
  let best = null;
  for (const slot of SLOT_KEYS){
    const it = gear[slot];
    if (it && (!best || it.score > best.score)) best = it;
  }
  return best;
}

/* ------------------------------ graves ------------------------------------ */
// Persistent world (2026-08-03 brief, design doc §11 — meta-progression is
// "unlocking, not numeric"). A grave is written into goquest_meta at the
// moment a hero is laid to rest (see renderDeath's click handler — mirrors
// how META.hall.push already works, so grave CREATION never touches the
// simulation core). What follows is the READ side: a LATER hero, questing
// through the zone an earlier hero fell in, has a small chance per task to
// come across the marker.
//
// Same discipline as unlockAchievement() throughout this file: every
// function below checks S._meta FIRST and only calls rng()/pick() after
// that check passes, so simulate(n) — where meta is always null — consumes
// zero extra randomness and the seeded balance numbers in CLAUDE.md don't move.

// Fixed per-task chance, independent of how many graves happen to be stored
// — 40 graves in the hall should feel exactly as special to stumble on as 1,
// not 40x noisier. eligibleGraves() below gates this on there being at least
// one real candidate in the CURRENT zone; which one gets found (if any) is a
// uniform pick among those candidates, not an independent roll per grave.
const GRAVE_FIND_CHANCE = 0.006;
// Even when a grave IS found, its stored heirloom (if the fallen hero had
// any gear worth remembering) isn't guaranteed to still be there — "can
// yield one piece of gear," not "always does." Once it's claimed by anyone
// it's gone for good (grave.heirloomRecovered), same as any other item.
const GRAVE_HEIRLOOM_CHANCE = 0.6;

// Which graves in META.graves this hero could plausibly stumble on RIGHT
// NOW: made in this same zone, not already found by THIS hero this run
// (foundGraveIds resets on every new hero — see createState), and — belt
// and suspenders on top of the structural guarantee that a living hero's
// own grave can't exist yet — never one bearing this hero's own name.
function eligibleGraves(S){
  const meta = S._meta;
  if (!meta || !meta.graves || !meta.graves.length) return [];
  const found = S.hero.foundGraveIds || [];
  return meta.graves.filter(g => g.zone === S.world.zone
                               && !found.includes(g.id)
                               && g.name !== S.hero.name);
}

// Template vars for GRAVE_EPITAPHS. {race}/{cls} resolve the grave's stored
// keys back through the CURRENT tables (same approach hallRow() uses), so a
// grave keeps reading correctly even if these definitions ever change shape.
function graveVars(grave, S){
  const raceName = (RACES[grave.race] && RACES[grave.race].name) || grave.race;
  return {
    name: grave.name,
    cls: (CLASSES[grave.cls] && CLASSES[grave.cls].name) || grave.cls,
    race: raceName,
    article: aOrAn(raceName),
    cause: grave.cause || "something the chronicle never named",
    level: grave.level,
    finder: S.hero.name,
  };
}

// Re-rolls the stored heirloom at the FINDING hero's CURRENT zone — the
// entire point of the mechanic (design doc §11): a Legendary stored from a
// level-48 hero must land on a level-6 finder exactly as if it had freshly
// dropped in zone 1, never as a cross-run power transfer. Only identity
// (name/slot/tier) and the owner tag come from the grave; ilvl, score and
// stats are generated fresh, the same shape generateItem() already uses.
// `owner` is read straight off the stored heirloom, never reassigned to the
// finder here — the sword stays Sesh's even generations later (see the "Lay
// Them to Rest" handler, which preserves an existing owner tag rather than
// overwriting it).
function generateHeirloom(zoneN, grave){
  const heir = grave.heirloom;
  const z = ZONES[zoneN-1];
  const ilvl = randInt(z.ilvl[0], z.ilvl[1]);
  const score = ilvl * TIERS[heir.tier].mult;
  const budget = Math.max(1, Math.round(score * BALANCE.gearBudget));
  const item = {
    name: heir.name, slot: heir.slot, tier: heir.tier, ilvl, score,
    stats: rollItemStats(heir.slot, budget), cheatDeath: 0,
    owner: heir.owner,
  };
  if (heir.slot === "relic" && rng() < 0.15) item.cheatDeath = 1;
  return item;
}

// heirloomRecoverer bookkeeping, shared by rollGraveDiscovery() (the normal
// per-task find roll) and applyGraveSenseAtCreation() (the graveSense
// achievement's guaranteed reveal) — both call this AFTER actually granting
// an heirloom item, never before, so the count only ever reflects real finds.
function noteHeirloomRecovered(S){
  if (!S._meta) return;
  S._meta.heirloomsRecovered = (S._meta.heirloomsRecovered || 0) + 1;
  saveMeta();
  if (S._meta.heirloomsRecovered >= 3) unlockAchievement(S._meta, "heirloomRecoverer", S);
}

function rollGraveDiscovery(S){
  if (!S._meta) return;                  // zero rng() draws when meta absent — simulate(n) harness
  const eligible = eligibleGraves(S);
  if (!eligible.length) return;
  if (rng() >= GRAVE_FIND_CHANCE) return;

  const h = S.hero;
  const grave = pick(eligible);
  h.foundGraveIds = h.foundGraveIds || [];
  h.foundGraveIds.push(grave.id);
  logEvent(S, "grave", fillTemplate(pick(GRAVE_EPITAPHS), graveVars(grave, S)), 2);

  if (grave.heirloom && !grave.heirloomRecovered && rng() < GRAVE_HEIRLOOM_CHANCE){
    grave.heirloomRecovered = true;
    saveMeta();   // meta is a live reference (attachMeta) — persist the claim right away,
                   // same discipline unlockAchievement() already follows, so the same
                   // heirloom can never be handed out to two different finders.
    const item = generateHeirloom(S.world.zone, grave);
    S.stats.itemsFound++;
    const equipped = S.gear[item.slot];
    const upgrade = !equipped || item.score > equipped.score;
    if (upgrade) equipItem(S, item); else S.inventory.push(item);
    logEvent(S, "heirloom", fillTemplate(pick(GRAVE_HEIRLOOM_LINES),
      Object.assign({owner: item.owner, itemName: item.name}, graveVars(grave, S))), 2);
    noteHeirloomRecovered(S);
  }
}

// tenHeroesRest achievement reward (meta.unlocks.graveSense) — "new heroes
// begin knowing where one of your fallen heroes lies." Called once from
// createState(), guarded on S._meta first (same discipline as every other
// grave function), so it costs simulate(n) zero extra rng() draws — the
// unlock flag is never set on the null meta the harness always passes.
// Deliberately NOT restricted to the hero's starting zone — foreknowledge
// isn't bound to where the hero happens to be standing yet. Reuses the
// SAME heirloom-recovery path rollGraveDiscovery() uses (generateHeirloom
// re-scales to the finder's CURRENT zone, i.e. zone 1 here — see CLAUDE.md
// "Graves and heirlooms," the whole point of the mechanic), so this is no
// stronger than an ordinary early grave find, just guaranteed instead of a
// per-task roll.
function applyGraveSenseAtCreation(S){
  const meta = S._meta;
  if (!meta || !meta.unlocks || !meta.unlocks.graveSense) return;
  if (!meta.graves || !meta.graves.length) return;
  const eligible = meta.graves.filter(g => g.name !== S.hero.name);
  if (!eligible.length) return;

  const grave = pick(eligible);
  S.hero.foundGraveIds = S.hero.foundGraveIds || [];
  S.hero.foundGraveIds.push(grave.id);
  const zoneName = (ZONES[grave.zone - 1] && ZONES[grave.zone - 1].name) || "a place not yet reached";
  logEvent(S, "grave", fillTemplate(pick(GRAVE_SENSE_LINES),
    Object.assign({zone: zoneName}, graveVars(grave, S))), 2);

  if (grave.heirloom && !grave.heirloomRecovered && rng() < GRAVE_HEIRLOOM_CHANCE){
    grave.heirloomRecovered = true;
    saveMeta();
    const item = generateHeirloom(S.world.zone, grave);
    S.stats.itemsFound++;
    const equipped = S.gear[item.slot];
    const upgrade = !equipped || item.score > equipped.score;
    if (upgrade) equipItem(S, item); else S.inventory.push(item);
    logEvent(S, "heirloom", fillTemplate(pick(GRAVE_HEIRLOOM_LINES),
      Object.assign({owner: item.owner, itemName: item.name}, graveVars(grave, S))), 2);
    noteHeirloomRecovered(S);
  }
}

/* ----------------------------- merchant trips ------------------------------ */
// Inventory-full is the trigger; the trip itself (sell/buy/heal) is
// instantaneous story-time, bookended by the same TRAVELING machinery zone
// changes use, just with an AT_MERCHANT waypoint state in between.

function beginMerchantTrip(S){
  S.world.state = "TRAVELING";
  S.world.travelKind = "merchant_out";
  S.world.travelMsLeft = MERCHANT_SECONDS * 1000;
  logEvent(S, "travel", `${S.hero.name}'s pack is full. Time to turn back toward town.`, 1);
}

function doMerchantTrip(S){
  const h = S.hero;
  const z = ZONES[S.world.zone - 1];
  const d = derived(h, S.gear);
  const cha = d.stats.cha;
  const goldAtTripStart = h.gold; // debug-only, for balance measurement (see hook below)

  // Prices track the zone's economic tier, not just itemScore — see the
  // BALANCE.priceZoneExp comment. zoneFactor is >1 in every zone past the
  // first and applies identically to buying and selling, so selling stays
  // meaningful relative to buying at every depth.
  const zoneFactor = Math.pow(z.gold / ZONES[0].gold, BALANCE.priceZoneExp);
  const priceOf = score => Math.round(score * BALANCE.buyPriceMult * zoneFactor * (1 - cha * 0.005) * d.buyMult);

  let earned = 0;
  for (const item of S.inventory) earned += Math.round(item.score * BALANCE.sellPriceMult * zoneFactor * (1 + cha * 0.005) * d.sellMult);
  const soldCount = S.inventory.length;
  h.gold += earned;
  S.stats.goldEarned += earned;
  S.inventory = [];

  function weakestSlot(){
    let slot = SLOT_KEYS[0], score = Infinity;
    for (const s of SLOT_KEYS){
      const sc = S.gear[s] ? S.gear[s].score : 0;
      if (sc < score){ score = sc; slot = s; }
    }
    return {slot, score};
  }

  // Keep buying upgrades for the weakest slot, re-evaluating after each
  // purchase, while they're affordable and a genuine upgrade — capped
  // per trip (merchantMaxBuys) so a rich hero re-kits, not re-kits forever.
  const bought = [];
  let blockedByPrice = false;
  let spent = 0;
  while (bought.length < BALANCE.merchantMaxBuys){
    const {slot, score} = weakestSlot();
    const stock = generateItem(z.n, slot, true, d.dropTierBump, undefined, archetypeForClass(h.cls));
    if (stock.score <= score) break;          // nothing better on offer for this slot tonight
    const price = priceOf(stock.score);
    if (h.gold < price){ blockedByPrice = true; break; }
    h.gold -= price;
    spent += price;
    equipItem(S, stock);
    bought.push(stock);
  }

  // Commissioning: once ordinary upgrades are exhausted, surplus gold can pay
  // a premium to guarantee a specific slot at a floor tier rather than hoping
  // stock rolls well — what a rich hero spends runoff on. Deliberately skips
  // the relic slot while the L48+ epic-relic ascension guarantee below still
  // needs it, so the two never bid on the same purchase, and deliberately
  // guarantees a tier BELOW that guarantee's epic/legendary floor, so
  // commissioning is never a substitute for it.
  let commissioned = null;
  {
    const relicGuaranteePending = h.level >= 48 && !hasEpicOrBetterRelic(S.gear);
    let cSlot = null, cScore = Infinity;
    for (const s of SLOT_KEYS){
      if (s === "relic" && relicGuaranteePending) continue;
      const sc = S.gear[s] ? S.gear[s].score : 0;
      if (sc < cScore){ cScore = sc; cSlot = s; }
    }
    if (cSlot){
      const commission = generateItem(z.n, cSlot, true, d.dropTierBump, BALANCE.commissionTier, archetypeForClass(h.cls));
      const price = Math.round(commission.score * BALANCE.buyPriceMult * BALANCE.commissionPriceMult
                                * zoneFactor * (1 - cha * 0.005) * d.buyMult);
      if (commission.score > cScore && h.gold >= price){
        h.gold -= price;
        spent += price;
        equipItem(S, commission);
        commissioned = commission;
        if (S._meta && !S._meta.hasCommissioned){
          S._meta.hasCommissioned = true;
          unlockAchievement(S._meta, "commissioner", S);   // saves meta itself
        }
      }
    }
  }

  // Ascension-gate guarantee (CLAUDE.md "known polish", design doc §10):
  // reaching level 50 unlocks the confrontation only with an Epic-or-better
  // relic equipped, but only ~2.2 Epic+ relics drop per full run on average —
  // roughly 11% of heroes who reach L50 would have no relic and no way to
  // ever trigger their own ending. Rather than relaxing the gate, once the
  // hero is deep enough to plausibly hit 50, the merchant makes sure a relic
  // worthy of the confrontation is on the table.
  if (h.level >= 48 && !hasEpicOrBetterRelic(S.gear)){
    const rilvl = randInt(z.ilvl[0], z.ilvl[1]);
    const rtier = rng() < BALANCE.confrontRelicLegendaryChance ? "legendary" : "epic";
    const rscore = rilvl * TIERS[rtier].mult;
    const rbudget = Math.max(1, Math.round(rscore * BALANCE.gearBudget));
    const relic = {name: genItemName("relic", rtier), slot:"relic", tier: rtier, ilvl: rilvl, score: rscore,
                    stats: rollItemStats("relic", rbudget), cheatDeath: rng() < 0.15 ? 1 : 0};
    const relicPrice = priceOf(relic.score);
    const curScore = S.gear.relic ? S.gear.relic.score : 0;
    if (relic.score > curScore && h.gold >= relicPrice){
      h.gold -= relicPrice;
      spent += relicPrice;
      equipItem(S, relic);
      if (relic.tier === "legendary" && S._meta) unlockAchievement(S._meta, "legendaryFound", S);
      logEvent(S, "gear", `${h.name} finds the merchant has something rarer than usual laid out — ${itemPhrase(relic)} — and doesn't leave without it.`, 2);
    }
  }

  // The heal is the point of the trip — merchant trips are effectively extra
  // lives, which makes their frequency and depth a primary balancing knob.
  const mMax = derived(h, S.gear).maxHP;
  h.hp = Math.min(mMax, h.hp + mMax * BALANCE.merchantHeal);
  S.stats.merchantTrips = (S.stats.merchantTrips || 0) + 1;
  h.skillState = {};   // refresh once-per-cycle triggered skills (design doc §9 step 4)
  logEvent(S, "merchant", merchantTripLine(h, soldCount, earned, bought, commissioned, blockedByPrice, S._meta, S.stats.merchantTrips), 1);
  // Debug-only hook for balance measurement (see CLAUDE.md testing notes) —
  // a no-op unless a test harness has set window._trackMerchant.
  if (typeof window !== "undefined" && window._trackMerchant)
    window._trackMerchant({zone: z.n, level: h.level, earned, spent, boughtCount: bought.length,
                            commissioned: !!commissioned, goldAfter: h.gold, goldAtTripStart});
}

// Phrase banks for the two shapes a trip with real stakes can take: a
// spend-down (multiple upgrades bought) and being priced out (couldn't
// afford what was on offer). Kept the same grim, grounded register as
// PERILS/DODGE_TAGS rather than a receipt.
const MERCHANT_REKIT_LINES = [
  "leaves the stall harder to kill than they walked in",
  "spends like they expect to need every bit of it",
  "walks out re-kitted, lighter of purse and heavier of gear",
  "spends the whole cycle's earnings without a second thought about it",
  "trades every spare coin for the chance to survive a little longer",
  "walks out of the stall looking like a different hero went in",
];
// Bonus rekit variant, unlocked by the commissioner achievement
// (meta.unlocks.merchantVeteran) — a nod to a player who's haggled this
// exact stall before. Appended, never substituted, and only when meta is
// present, so merchantTripLine()'s output for the harness (meta undefined)
// is byte-identical to before this change.
const MERCHANT_REKIT_VETERAN_LINES = [
  "spends like someone who's haggled this exact stall before",
];
const MERCHANT_PRICED_OUT_LINES = [
  "what's worth having tonight is priced past reach",
  "the good gear wants a deeper purse than this one",
  "counts the coin twice and still can't stretch to it",
  "the merchant names a price that doesn't move, no matter how it's counted",
  "walks the stall twice and can't make the numbers work",
];
// Opener/closer variety for the trip line itself — previously two fixed
// clauses bookending every one of the ~15-18 merchant trips a run makes.
// hashPick(), not pick() — merchantTripLine() runs inside the simulation
// core (called from doMerchantTrip, called from completeTask) and has never
// spent an rng() draw of its own; a real draw here would shift the seeded
// stream. Seeded on the hero's name plus this trip's ordinal
// (S.stats.merchantTrips, passed in as `tripN`), so consecutive trips by the
// same hero don't repeat.
const MERCHANT_OPENERS = [
  "{name} makes for the merchant's stall",
  "{name} ducks into the merchant's stall, glad of the pause",
  "{name} spends the lull at the merchant's stall",
  "{name} stops at the familiar stall, same as every cycle before this one",
  "{name} makes the walk back to the merchant's stall",
  "{name} takes the detour to the merchant's stall without needing to think about it",
];
const MERCHANT_CLOSERS = [
  "Wounds close, breath comes easy again, and they turn back to the road.",
  "The worst of it mends. They shoulder what's left and turn back to the road.",
  "Whatever the stall couldn't fix, time and the walk back will have to.",
  "Patched up as well as coin allows, they turn back toward whatever's next.",
  "It isn't rest, not really, but it's close enough. They turn back to the road.",
];

function merchantTripLine(h, soldCount, earned, bought, commissioned, blockedByPrice, meta, tripN){
  const rekitPool = (meta && meta.unlocks && meta.unlocks.merchantVeteran)
    ? MERCHANT_REKIT_LINES.concat(MERCHANT_REKIT_VETERAN_LINES) : MERCHANT_REKIT_LINES;
  const soldPart = soldCount > 0
    ? `unloads ${soldCount} piece${soldCount === 1 ? "" : "s"} of salvage for ${earned} gold`
    : "finds nothing worth selling";

  let outcome = "";
  if (bought.length > 1) outcome = `and ${pick(rekitPool)} — ${bought.length} pieces replaced`;
  else if (bought.length === 1) outcome = `and walks out with ${itemPhrase(bought[0])}`;
  else if (blockedByPrice) outcome = `but ${pick(MERCHANT_PRICED_OUT_LINES)}`;

  const seed = h.name + "#merchant#" + (tripN == null ? 0 : tripN);
  const opener = fillTemplate(hashPick(MERCHANT_OPENERS, seed + "#o"), {name: h.name});
  const closer = hashPick(MERCHANT_CLOSERS, seed + "#c");

  let text = `${opener} — ${soldPart}${outcome ? " " + outcome : ""}. `;
  if (commissioned) text += `${h.name} pays a hard premium to have ${itemPhrase(commissioned)} made to order. `;
  // "they" rather than the name again — the opener already establishes it,
  // and there is no other actor in this clause for the pronoun to attach to.
  text += closer;
  return text;
}

function arriveAtMerchant(S){
  S.world.state = "AT_MERCHANT";
  doMerchantTrip(S);
  S.world.state = "TRAVELING";
  S.world.travelKind = "merchant_return";
  S.world.travelMsLeft = MERCHANT_SECONDS * 1000;
}

function arriveBackFromMerchant(S){
  S.world.travelKind = null;
  S.world.state = "QUESTING";
  S.world.taskProgressMs = 0;
  S.world.taskName = pick(TASKS[S.world.zone]);
}

// Resumes QUESTING after a dilemma option's time cost has been spent (see
// DILEMMAS / finishChoice()) — same shape as arriveBackFromMerchant(), just
// without a merchant leg. Consumed through the normal advance() ms-budget
// like any other travel state, which is what keeps a costly dilemma inside
// the bank-and-chain flow instead of needing its own special case.
function arriveAfterDilemmaDelay(S){
  S.world.travelKind = null;
  S.world.state = "QUESTING";
  S.world.taskProgressMs = 0;
  S.world.taskName = pick(TASKS[S.world.zone]);
  const z = zoneForLevel(S.hero.level);
  if (z.n !== S.world.zone) beginTravel(S, z.n);
}

function completeTask(S){
  const h = S.hero, w = S.world;
  const d = derived(h, S.gear);
  const z = ZONES[w.zone - 1];

  const xp   = Math.round(z.xp   * d.xpMult);
  const gold = Math.round(z.gold * d.goldMult);
  h.xp += xp;
  h.gold += gold;
  S.stats.tasksCompleted++;
  S.stats.goldEarned += gold;

  // Regen lands before the peril roll, so the day's toll is measured against
  // a topped-up hero rather than whatever HP the hero happened to end the last task at.
  h.hp = Math.min(d.maxHP, h.hp + d.regenPerTask);

  logEvent(S, "task", `${w.taskName} — ${xp} xp, ${gold} gold.`, 0);

  rollDrop(S);
  rollPeril(S);
  if (w.state !== "QUESTING") return;   // dead — the sim halts, nothing left to check
  rollGraveDiscovery(S);                // no-op (and zero rng draws) when S._meta is null
  checkTriggers(S);
  decayBoons(S);

  // Level-up may cascade; stop immediately if it blocks or starts travel.
  let guard = 0;
  while (h.level < 50 && h.xp >= xpToNext(h.level) && guard++ < 60){
    h.xp -= xpToNext(h.level);
    levelUp(S);
    if (w.state !== "QUESTING") return;
  }
  if (h.level >= 50) h.xp = 0;

  // Ascension gate (design doc §10): level 50 + an Epic-or-better relic.
  // Checked every task once level 50 so a relic gained here via a drop, or
  // via a merchant trip, triggers the confrontation on the very next tick
  // rather than only at the moment of leveling.
  if (h.level >= 50 && w.state === "QUESTING" && hasEpicOrBetterRelic(S.gear)){
    beginConfrontation(S);
    return;
  }

  if (S.inventory.length >= invSlots(S)){ beginMerchantTrip(S); return; }

  w.taskName = pick(TASKS[w.zone]);
}

function hasEpicOrBetterRelic(gear){
  const r = gear.relic;
  return !!(r && (r.tier === "epic" || r.tier === "legendary"));
}

// Percentage-of-maxHP damage is deliberate (design doc §7) — it keeps the
// danger curve stable as HP scales, so tuning touches one number, not two.
function rollPeril(S){
  const h = S.hero, w = S.world, d = derived(h, S.gear);
  const z = ZONES[w.zone - 1];
  if (rng() >= z.peril * d.perilMult * BALANCE.perilChanceMult) return;

  const desc = pick(PERILS[z.n]);
  if (rng() < d.evasion){
    logEvent(S, "peril", `${desc} — ${pick(DODGE_TAGS)}`, 0);
    S.stats.perilsSurvived++;
    return;
  }

  const frac = (z.dmg[0] + rng() * (z.dmg[1] - z.dmg[0])) * BALANCE.perilDmgMult;
  const pool = BALANCE.dmgHpBlend * d.maxHP
             + (1 - BALANCE.dmgHpBlend) * refHP(h.level);
  const dmg = Math.round(pool * frac * (1 - d.mitigation));
  const wasSafe = h.hp / d.maxHP >= 0.20;
  const after = h.hp - dmg;

  if (after > 0){
    h.hp = after;
    logEvent(S, "peril", `${desc} — ${dmg} damage.`, 0);
    S.stats.perilsSurvived++;
    // Near-death is on the permanent-retention list, but only the crossing,
    // not every subsequent task spent under the threshold.
    if (wasSafe && h.hp / d.maxHP < 0.20){
      logEvent(S, "neardeath", nearDeathLine(S), 1);
      noteNearDeathCrossing(S);
    }
    return;
  }

  // Skill-granted charges (Ancestral Ward and kin) carry their own flavor
  // text and are spent before the generic race/gear charges, so a hero who
  // has one always gets the named line rather than the generic one.
  if (h.skillCheatDeathQueue && h.skillCheatDeathQueue.length){
    const text = h.skillCheatDeathQueue.shift();
    h.hp = 1;
    logEvent(S, "cheatdeath", `${desc} — ${text.replace("{name}", h.name)}`, 2);
    S.stats.perilsSurvived++;
    return;
  }

  if (h.cheatDeathCharges > 0){
    h.cheatDeathCharges--;
    h.hp = 1;
    logEvent(S, "cheatdeath", `${desc} — ${pick(cheatDeathPool(S)).replace("{name}", h.name)}`, 2);
    S.stats.perilsSurvived++;
    return;
  }

  h.hp = 0;
  w.state = "DEAD";
  w.killedBy = desc;
  w.epilogueIdx = randInt(0, EPILOGUES.length - 1);
  S.stats.deathTime = w.clock;
  onHeroDeath(S);
  logEvent(S, "death", `${desc} — ${h.name}'s road ends here.`, 2);
}

// Begins the scripted ~10-step final confrontation (design doc §10). Not a
// blocking choice — the gate (level 50 + Epic-or-better relic) is checked
// automatically in completeTask(), and once satisfied the sim just walks
// into the climax the way it walks into a zone change.
function beginConfrontation(S){
  const w = S.world;
  w.state = "CONFRONTATION";
  w.confrontation = {step: 0};
  w.taskProgressMs = 0;
  const base = fillTemplate(pick(confrontAnnouncePool(S)), threadVars(S));
  logEvent(S, "confrontation", base + confrontationFlagLine(S), 2);
}

// One step of the confrontation: a scripted narrative beat (not a random
// task line) plus an elevated peril roll. Ten of these, survived in a row,
// is ascension.
function completeConfrontationStep(S){
  const h = S.hero, w = S.world;
  const d = derived(h, S.gear);
  const type = w.thread.antagonistType;

  // Some recovery between clashes, but nowhere near a merchant's full heal —
  // there is no merchant inside the confrontation. BALANCE.confrontRegenMult
  // is the knob (0 = none, 1 = a full normal task's regen).
  h.hp = Math.min(d.maxHP, h.hp + d.regenPerTask * BALANCE.confrontRegenMult);

  const seq = CONFRONTATION_SEQUENCE[type];
  const idx = Math.min(w.confrontation.step, seq.length - 1);
  logEvent(S, "confrontation", fillTemplate(seq[idx], threadVars(S)), 2);

  rollConfrontationPeril(S);
  if (w.state !== "CONFRONTATION") return;   // death ended it, same as rollPeril()

  w.confrontation.step++;
  if (w.confrontation.step >= CONFRONTATION_STEPS){
    w.state = "ASCENDED";
    w.ascendedAt = w.clock;
    w.ascensionEpilogueIdx = randInt(0, ASCENSION_EPILOGUES.length - 1);
    logEvent(S, "ascension", fillTemplate(pick(ASCENSION_LINES[type]), threadVars(S)), 2);
    if (S._meta){
      S._meta.ascensionCount = (S._meta.ascensionCount || 0) + 1;
      saveMeta();   // counts 2, 4, 5... unlock nothing, so nothing else would flush them
      if (S._meta.ascensionCount === 1) unlockAchievement(S._meta, "ascendOnce", S);
      if (S._meta.ascensionCount === 3) unlockAchievement(S._meta, "ascendThrice", S);
      // ascendAllLineages: which tier-1 lineage this ascension belongs to,
      // via the shared LINEAGE_OF map (a hero who ascends before L25 stays
      // novice/tier-1 and isn't forked yet, but the confrontation is gated
      // on L50 so h.cls is always a real tier-2 class here).
      const lineage = LINEAGE_OF[h.cls] || h.cls;
      S._meta.ascendedLineages = S._meta.ascendedLineages || [];
      if (!S._meta.ascendedLineages.includes(lineage)){
        S._meta.ascendedLineages.push(lineage);
        saveMeta();
      }
      if (S._meta.ascendedLineages.length >= 3) unlockAchievement(S._meta, "ascendAllLineages", S);
    }
    onHeroRunEnd(S);   // an ascended run's tasks count toward the lifetime tally too
  }
}

// Elevated-danger analogue of rollPeril() for the confrontation only — own
// BALANCE knobs (confrontPerilChance/confrontDmgMin/Max), own flavor bank,
// but the exact same evasion/mitigation/cheat-death machinery so a hero's
// build still matters at the very end.
function rollConfrontationPeril(S){
  const h = S.hero, w = S.world, d = derived(h, S.gear);
  const type = w.thread.antagonistType;
  if (rng() >= BALANCE.confrontPerilChance * d.perilMult) return;

  const desc = fillTemplate(pick(CONFRONTATION_PERILS[type]), threadVars(S));
  if (rng() < d.evasion){
    logEvent(S, "peril", `${desc} — ${pick(DODGE_TAGS)}`, 1);
    S.stats.perilsSurvived++;
    return;
  }

  const frac = BALANCE.confrontDmgMin + rng() * (BALANCE.confrontDmgMax - BALANCE.confrontDmgMin);
  const pool = BALANCE.dmgHpBlend * d.maxHP + (1 - BALANCE.dmgHpBlend) * refHP(h.level);
  const dmg = Math.round(pool * frac * (1 - d.mitigation));
  const after = h.hp - dmg;

  if (after > 0){
    h.hp = after;
    logEvent(S, "peril", `${desc} — ${dmg} damage.`, 1);
    S.stats.perilsSurvived++;
    return;
  }

  if (h.skillCheatDeathQueue && h.skillCheatDeathQueue.length){
    const text = h.skillCheatDeathQueue.shift();
    h.hp = 1;
    logEvent(S, "cheatdeath", `${desc} — ${text.replace("{name}", h.name)}`, 2);
    S.stats.perilsSurvived++;
    return;
  }
  if (h.cheatDeathCharges > 0){
    h.cheatDeathCharges--;
    h.hp = 1;
    logEvent(S, "cheatdeath", `${desc} — ${pick(cheatDeathPool(S)).replace("{name}", h.name)}`, 2);
    S.stats.perilsSurvived++;
    return;
  }

  h.hp = 0;
  w.state = "DEAD";
  w.killedBy = desc;
  w.epilogueIdx = randInt(0, EPILOGUES.length - 1);
  w.diedInConfrontation = true;
  S.stats.deathTime = w.clock;
  onHeroDeath(S);
  logEvent(S, "death", `${desc} — ${h.name}'s road ends here.`, 2);
}

/**
 * Consume `ms` of simulated time. Returns the milliseconds it could NOT spend
 * because the hero entered a blocking state (AWAITING_CHOICE / DEAD /
 * ASCENDED). Returning leftover instead of discarding it is what makes
 * bank-and-chain catch-up work.
 */
function advance(S, ms){
  let guard = 0;
  while (ms > 0){
    if (++guard > 500000) break;              // paranoia against a zero-cost state
    const w = S.world;
    if (w.state === "QUESTING"){
      const need = derived(S.hero, S.gear).taskMs - w.taskProgressMs;
      if (ms < need){ w.taskProgressMs += ms; w.clock += ms; return 0; }
      ms -= need; w.taskProgressMs = 0; w.clock += need;
      completeTask(S);
    } else if (w.state === "TRAVELING"){
      if (ms < w.travelMsLeft){ w.travelMsLeft -= ms; w.clock += ms; return 0; }
      ms -= w.travelMsLeft; w.clock += w.travelMsLeft; w.travelMsLeft = 0;
      if (w.travelKind === "merchant_out") arriveAtMerchant(S);
      else if (w.travelKind === "merchant_return") arriveBackFromMerchant(S);
      else if (w.travelKind === "dilemma_delay") arriveAfterDilemmaDelay(S);
      else arriveInZone(S);
    } else if (w.state === "CONFRONTATION"){
      const need = derived(S.hero, S.gear).taskMs - w.taskProgressMs;
      if (ms < need){ w.taskProgressMs += ms; w.clock += ms; return 0; }
      ms -= need; w.taskProgressMs = 0; w.clock += need;
      completeConfrontationStep(S);
    } else {
      return ms;                              // blocked (AWAITING_CHOICE / DEAD / ASCENDED)
    }
  }
  return 0;
}

function resolveChoice(S, optionKey){
  const c = S.world.pendingChoice;
  if (!c) return;
  let delayMs = 0;
  if (c.kind === "class"){
    S.hero.cls = optionKey;
    S.hero.classPath.push(optionKey);
    logEvent(S, "class", `${S.hero.name} takes up the way of the ${CLASSES[optionKey].name}.`, 2);
  } else if (c.kind === "class2"){
    S.hero.cls = optionKey;
    S.hero.classPath.push(optionKey);
    logEvent(S, "class", `${S.hero.name} takes up the way of the ${CLASSES[optionKey].name}.`, 2);
    const passiveKey = CLASSES[optionKey].passive;
    if (passiveKey){
      grantSkill(S, passiveKey);
      const sk = SKILLS[passiveKey];
      logEvent(S, "skill", `${S.hero.name} awakens to ${sk.name} — ${sk.blurb}`, 2);
    }
    if (S._meta){
      S._meta.classesReached = S._meta.classesReached || [];
      if (!S._meta.classesReached.includes(optionKey)){
        S._meta.classesReached.push(optionKey);
        // Persist IMMEDIATELY. unlockAchievement() calls saveMeta(), but it only
        // fires on the 12th class — so for classes 1..11 the push lived only in
        // memory and was lost on the next load. That is why a Beastmaster could
        // be played to completion and still show unreached (Rob, 2026-08-03).
        // Any META mutation inside the core needs its own saveMeta(); don't rely
        // on a later achievement or screen handler to flush it.
        saveMeta();
      }
      if (S._meta.classesReached.length >= 12) unlockAchievement(S._meta, "allAdvancedClasses", S);
    }
  } else if (c.kind === "skill"){
    grantSkill(S, optionKey);
    const sk = SKILLS[optionKey];
    logEvent(S, "skill", `${S.hero.name} learns ${sk.name} — ${sk.blurb}`, 2);
  } else if (c.kind === "dilemma"){
    const dil = DILEMMAS[c.dilemmaKey];
    const opt = dil && dil.options[optionKey];
    if (opt) delayMs = opt.apply(S) || 0;
    // allDilemmas: which of the five dilemma KEYS (not options) has been
    // resolved at least once, across every hero. Same "save at the point of
    // mutation" discipline as classesReached — don't rely on the achievement
    // firing to flush it, or progress made toward it silently vanishes on reload.
    if (S._meta){
      S._meta.dilemmasResolved = S._meta.dilemmasResolved || [];
      if (!S._meta.dilemmasResolved.includes(c.dilemmaKey)){
        S._meta.dilemmasResolved.push(c.dilemmaKey);
        saveMeta();
      }
      if (S._meta.dilemmasResolved.length >= Object.keys(DILEMMAS).length)
        unlockAchievement(S._meta, "allDilemmas", S);
    }
  }
  S.world.pendingChoice = null;
  finishChoice(S, delayMs);
}

// Shared tail for every resolved blocking choice. Class/skill/class2 always
// pass delayMs 0 (resume immediately); a dilemma option that costs time
// routes through the "dilemma_delay" travel state instead, so the cost is
// spent through the normal advance() ms-budget — see arriveAfterDilemmaDelay().
function finishChoice(S, delayMs){
  if (delayMs > 0){
    S.world.state = "TRAVELING";
    S.world.travelKind = "dilemma_delay";
    S.world.travelMsLeft = delayMs;
    return;
  }
  S.world.state = "QUESTING";
  const z = zoneForLevel(S.hero.level);
  if (z.n !== S.world.zone) beginTravel(S, z.n);
}

/* ========================== end simulation core ========================== */

/* ------------------------------ persistence ------------------------------ */

let S = null;
let META = null;

function defaultMeta(){
  return {version: META_VERSION, achievements:[], unlocks:{}, hall:[], heroesRun:0,
          lifetimeTasks:0, classesReached:[], ascensionCount:0, heroesLaidToRest:0,
          graves:[], graveSeq:0,
          dilemmasResolved:[], heirloomsRecovered:0, hasCommissioned:false,
          nearDeathCrossings:0, racesPlayed:[], ascendedLineages:[]};
}
// Every new meta field needs both a default here AND a fallback below, same
// discipline as the hero save's migrate() — a corrupted or pre-Phase-7
// goquest_meta must load cleanly, not throw.
function migrateMeta(m){
  if (!m || typeof m !== "object") return defaultMeta();
  if (m.version === undefined) m.version = 1;
  if (!Array.isArray(m.achievements)) m.achievements = [];
  if (!m.unlocks || typeof m.unlocks !== "object") m.unlocks = {};
  if (!Array.isArray(m.hall)) m.hall = [];
  if (m.heroesRun === undefined) m.heroesRun = 0;
  // v1 -> v2 (Phase 7: achievement bookkeeping fields)
  // deathZones fed the removed "Six Graves" achievement; drop it rather than
  // carry dead state forward. lifetimeTasks replaces it.
  if (m.deathZones !== undefined) delete m.deathZones;
  if (typeof m.lifetimeTasks !== "number") m.lifetimeTasks = 0;
  if (!Array.isArray(m.classesReached)) m.classesReached = [];
  if (m.ascensionCount === undefined) m.ascensionCount = 0;
  if (m.heroesLaidToRest === undefined) m.heroesLaidToRest = 0;
  // v2 -> v3 (graves & heirlooms, 2026-08-03 brief). A pre-existing hall of
  // Fallen heroes predates grave-tracking entirely — they just won't have a
  // grave on record, same as an old save with no achievements yet.
  if (!Array.isArray(m.graves)) m.graves = [];
  if (m.graveSeq === undefined) m.graveSeq = 0;
  // v3 -> v4 (2026-08-07 achievement expansion). Six new counters — a
  // pre-existing save just starts every one of them at zero/empty, same as
  // any other never-earned achievement's tracked progress. The old
  // unlocks.invSlotBonus (from a pre-expansion tenHeroesRest earn) is
  // deliberately left alone — see CLAUDE.md "A Long List of Names": an
  // already-earned reward isn't retroactively taken away, and invSlots()/
  // hero.metaInvBonus still read it correctly for exactly that reason.
  if (!Array.isArray(m.dilemmasResolved)) m.dilemmasResolved = [];
  if (m.heirloomsRecovered === undefined) m.heirloomsRecovered = 0;
  if (m.hasCommissioned === undefined) m.hasCommissioned = false;
  if (m.nearDeathCrossings === undefined) m.nearDeathCrossings = 0;
  if (!Array.isArray(m.racesPlayed)) m.racesPlayed = [];
  if (!Array.isArray(m.ascendedLineages)) m.ascendedLineages = [];
  m.version = META_VERSION;
  return m;
}
function loadMeta(){
  try {
    const raw = localStorage.getItem(META_KEY);
    if (raw) return migrateMeta(JSON.parse(raw));
  } catch(e){ console.warn("meta save unreadable", e); }
  return defaultMeta();
}
function saveMeta(){ try{ localStorage.setItem(META_KEY, JSON.stringify(META)); }catch(e){} }

function saveGame(){
  if (!S) return;
  S.lastTick = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }
  catch(e){ pruneLog(S); try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e2){} }
}
function loadGame(){
  let raw;
  try { raw = localStorage.getItem(SAVE_KEY); } catch(e){ return null; }
  if (!raw) return null;
  try {
    const s = JSON.parse(raw);
    if (!s || !s.hero || !s.world) return null;
    if (!RACES[s.hero.race] || !CLASSES[s.hero.cls]) return null;
    return attachMeta(migrate(s), META);
  } catch(e){ console.warn("hero save corrupt, starting fresh", e); return null; }
}
function migrate(s){
  // Version chain lives here. Every new field needs a default AND a fallback.
  if (s.version === undefined) s.version = 1;
  if (s.world.bankedMs === undefined) s.world.bankedMs = 0;
  if (!s.hero.statFrac){ s.hero.statFrac = {}; for (const k of STAT_KEYS) s.hero.statFrac[k] = 0; }
  if (!s.world.clock) s.world.clock = s.lastTick || Date.now();
  if (s.world.killedBy === undefined) s.world.killedBy = null;
  if (s.world.epilogueIdx === undefined) s.world.epilogueIdx = null;
  // v2 -> v3 (Phase 4, gear/inventory/merchant). v2 saves already carry six
  // null gear slots and an empty inventory (declared ahead of schedule in
  // Phase 3), so this is gentle: only the new bookkeeping fields.
  if (!s.gear) s.gear = {weapon:null, armor:null, helm:null, gloves:null, boots:null, relic:null};
  if (!s.inventory) s.inventory = [];
  if (s.world.travelKind === undefined) s.world.travelKind = null;
  if (s.stats.merchantTrips === undefined) s.stats.merchantTrips = 0;
  // v3 -> v4 (Phase 5, classes & skills). hero.skills/classPath already
  // existed ahead of schedule; only the new skill-runtime bookkeeping needs a
  // fallback here.
  if (!s.hero.skillCheatDeathQueue) s.hero.skillCheatDeathQueue = [];
  if (!s.hero.skillState) s.hero.skillState = {};
  // v4 -> v5 (Phase 6, story/acts/ascension). world.thread and world.act
  // already existed as stub fields (thread always null, act always 1, since
  // nothing before this phase ever wrote to either) — populate them for
  // saves predating this phase rather than adding parallel fields. act can't
  // be fixed with an undefined/null check like the others below: it was
  // always present, just always wrong (stuck at 1) for anyone past Act I, so
  // this has to be gated on save version instead of field presence.
  if (!s.world.thread) s.world.thread = rollThread(META);
  if (s.version < 5) s.world.act = actForLevel(s.hero.level).n;
  if (s.world.confrontation === undefined) s.world.confrontation = null;
  if (s.world.diedInConfrontation === undefined) s.world.diedInConfrontation = false;
  if (s.world.ascendedAt === undefined) s.world.ascendedAt = null;
  if (s.world.ascensionEpilogueIdx === undefined) s.world.ascensionEpilogueIdx = null;
  // v5 -> v6 (Phase 7, meta-progression). Baked-in unlock effects live on the
  // hero itself (see createState) — old saves predate both fields entirely.
  if (s.hero.metaDropBonus === undefined) s.hero.metaDropBonus = 0;
  if (s.hero.metaInvBonus === undefined) s.hero.metaInvBonus = 0;
  // v6 -> v7 (narrative dilemma gates + Act IV failure + boons, 2026-08-03
  // brief). flags/act4FailureDone are new world fields; boons is a new
  // hero-runtime field alongside skillCheatDeathQueue/skillState.
  if (!s.world.flags) s.world.flags = {};
  if (s.world.act4FailureDone === undefined) s.world.act4FailureDone = false;
  if (!s.hero.boons) s.hero.boons = [];
  // v7 -> v8 (graves & heirlooms, 2026-08-03 brief). Per-hero record of which
  // graves THIS hero has already found, so a save from before the feature
  // existed just starts with an empty list — nothing to migrate out of.
  if (!Array.isArray(s.hero.foundGraveIds)) s.hero.foundGraveIds = [];
  // v8 -> v9 (2026-08-07 achievement expansion). Four new baked-at-creation
  // meta perks, same pattern as metaDropBonus/metaInvBonus above — a save
  // from before this pass just gets 0 (no perk), same as a hero who was
  // created before the player had earned it.
  if (s.hero.metaDropTierBump === undefined) s.hero.metaDropTierBump = 0;
  if (s.hero.metaEvasionBonus === undefined) s.hero.metaEvasionBonus = 0;
  if (s.hero.metaBuyDiscount === undefined) s.hero.metaBuyDiscount = 0;
  if (s.hero.metaXpBonus === undefined) s.hero.metaXpBonus = 0;
  s.version = SAVE_VERSION;
  return s;
}

/* ------------------------------ import/export ----------------------------- */
// One export file carries BOTH localStorage keys (see CLAUDE.md "Save" — they
// are deliberately separate so a corrupt hero never wipes lifetime progress,
// but that means an export has to bundle both or a restore would silently
// lose everything except the current hero). Render/persistence layer only —
// nothing here touches the simulation core.

const EXPORT_MARKER = "chronicles-rpg-save-v1";

function buildExportPayload(){
  if (S) saveGame();     // flush the freshest in-memory hero before reading it back
  saveMeta();
  let heroRaw = null, metaRaw = null;
  try { heroRaw = localStorage.getItem(SAVE_KEY); } catch(e){}
  try { metaRaw = localStorage.getItem(META_KEY); } catch(e){}
  let hero = null, meta = defaultMeta();
  try { if (heroRaw) hero = JSON.parse(heroRaw); } catch(e){}
  try { if (metaRaw) meta = JSON.parse(metaRaw); } catch(e){}
  return {
    marker: EXPORT_MARKER,
    exportedAt: Date.now(),   // file metadata for a human/filesystem, not a chronicle stamp — fine outside the sim core
    saveVersion: SAVE_VERSION,
    metaVersion: META_VERSION,
    hero,                      // null when exported from the creation screen with no live hero
    meta,
  };
}

function exportGameData(){
  const payload = buildExportPayload();
  const json = JSON.stringify(payload, null, 2);
  const blob = new Blob([json], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const d = new Date();
  const stamp = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const a = document.createElement("a");
  a.href = url;
  a.download = `chronicles-rpg-save-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// Mirrors loadGame()'s own hero-shape check (hero/world objects + a known
// race/cls) so a bad import is rejected the same way a corrupt localStorage
// save already is — validated BEFORE anything is written.
function validateImportPayload(obj){
  if (!obj || typeof obj !== "object" || Array.isArray(obj))
    return "That doesn't look like a Chronicles RPG save file.";
  if (obj.marker !== EXPORT_MARKER)
    return "That doesn't look like a Chronicles RPG save file.";
  if (obj.hero !== null && obj.hero !== undefined){
    const h = obj.hero;
    if (!h || typeof h !== "object" || !h.hero || typeof h.hero !== "object" ||
        !h.world || typeof h.world !== "object")
      return "The save file's hero data is incomplete or corrupted.";
    if (!RACES[h.hero.race] || !CLASSES[h.hero.cls])
      return "The save file's hero has a race or class this version doesn't recognize.";
  }
  if (obj.meta !== null && obj.meta !== undefined &&
      (typeof obj.meta !== "object" || Array.isArray(obj.meta)))
    return "The save file's lifetime progress data is corrupted.";
  return null;   // valid
}

// A validated-but-not-yet-applied import. Gates render() ahead of every other
// screen (metaView, hero state, creation) so the confirm works no matter
// where the file was dropped from — the creation screen included.
let importConfirmPayload = null;

function renderImportConfirm(){
  const payload = importConfirmPayload;
  const incoming = payload.hero
    ? `${esc(payload.hero.hero.name)}, level ${payload.hero.hero.level} ${esc(CLASSES[payload.hero.hero.cls].name)}`
    : "no hero";
  const current = S ? `${esc(S.hero.name)}, level ${S.hero.level} ${esc(CLASSES[S.hero.cls].name)}` : "no hero";
  const hallCount = payload.meta && Array.isArray(payload.meta.hall) ? payload.meta.hall.length : 0;
  const achCount = payload.meta && Array.isArray(payload.meta.achievements) ? payload.meta.achievements.length : 0;
  app.innerHTML = `
    <div class="modal"><div class="card">
      <h2>Import Save Data?</h2>
      <p class="muted tiny">This replaces the current hero (${current}) and ALL lifetime progress —
        achievements, the Hall of Legends, graves, everything — with what's in the file: ${incoming},
        ${hallCount} Hall ${hallCount === 1 ? "entry" : "entries"}, ${achCount} earned
        achievement${achCount === 1 ? "" : "s"}. This cannot be undone.</p>
      <button class="btn" id="import-confirm" style="margin-top:14px">Yes, Replace Everything</button>
      <button class="btn ghost" id="import-cancel" style="margin-top:8px">Never Mind</button>
    </div></div>`;
  document.getElementById("import-confirm").addEventListener("click", () => applyImportPayload(payload));
  document.getElementById("import-cancel").addEventListener("click", () => {
    importConfirmPayload = null; render();
  });
}

function applyImportPayload(payload){
  let prevHeroRaw = null, prevMetaRaw = null;
  try { prevHeroRaw = localStorage.getItem(SAVE_KEY); } catch(e){}
  try { prevMetaRaw = localStorage.getItem(META_KEY); } catch(e){}
  try {
    if (payload.hero) localStorage.setItem(SAVE_KEY, JSON.stringify(payload.hero));
    else localStorage.removeItem(SAVE_KEY);
    localStorage.setItem(META_KEY, JSON.stringify(payload.meta || defaultMeta()));
  } catch(e){
    // Best-effort rollback — a failed write must not leave storage half-written.
    try {
      if (prevHeroRaw != null) localStorage.setItem(SAVE_KEY, prevHeroRaw); else localStorage.removeItem(SAVE_KEY);
      if (prevMetaRaw != null) localStorage.setItem(META_KEY, prevMetaRaw);
    } catch(e2){}
    importConfirmPayload = null;
    render();
    showImportError("Could not write the import — storage may be full. Nothing was changed.");
    return;
  }
  // Disarm beforeunload's re-save of the OLD in-memory state before navigating
  // away (see CLAUDE.md "Testing without corrupting a save" — this exact class
  // of bug has bitten the project twice). Reloading hands off cleanly to the
  // normal boot path, which runs the imported data through migrate()/
  // migrateMeta() exactly like any other load.
  S = null;
  importConfirmPayload = null;
  location.reload();
}

function showImportError(msg){
  const el = document.getElementById("import-error");
  if (el) el.textContent = msg;
}

function tryImportText(text){
  showImportError("");
  let obj;
  try { obj = JSON.parse(text); }
  catch(e){ showImportError("That file isn't valid JSON — it may be truncated or damaged."); return; }
  const err = validateImportPayload(obj);
  if (err){ showImportError(err); return; }
  importConfirmPayload = obj;
  render();
}

// The bottom-of-screen utility row ("very bottom", quiet, .btn.ghost, well
// separated from gameplay controls). Shared by renderMain() and
// renderCreation() so import works with or without a live hero.
// Collapsible from the title, closed by default (Rob, 2026-08-07) — the
// outer element IS the <details> (replacing the plain .card div), with the
// title itself as <summary> so the whole heading row is the tap target,
// same idiom as .ach-progress's "Progress" disclosure. No `open` attribute
// means every render starts collapsed; the browser keeps it open across
// re-renders within a session on its own (native <details> state), so a
// mid-import view of this card doesn't slam shut under the player's thumb.
function saveDataRow(){
  return `
    <details class="card save-data" style="margin-top:4px">
      <summary>Save Data</summary>
      <div class="save-data-body">
        <p class="tiny muted" style="margin:0 0 10px">Export saves the current hero and all lifetime
          progress to a file. Import replaces both with a previously exported file.</p>
        <button class="btn ghost" id="export-save" type="button">Export Save Data</button>
        <label for="import-file">Import Save Data</label>
        <input type="file" id="import-file" accept="application/json,.json">
        <details style="margin-top:12px">
          <summary class="tiny muted" style="cursor:pointer">Paste a save instead</summary>
          <textarea id="import-paste" rows="4" placeholder="Paste exported save JSON here" style="margin-top:8px"></textarea>
          <button class="btn ghost" id="import-paste-btn" type="button" style="margin-top:8px">Import Pasted Save</button>
        </details>
        <div id="import-error" class="tiny" style="margin-top:10px; min-height:1em; color:var(--blood)"></div>
      </div>
    </details>`;
}
function wireSaveDataRow(){
  const exportBtn = document.getElementById("export-save");
  if (exportBtn) exportBtn.addEventListener("click", () => {
    try { exportGameData(); } catch(e){ showImportError("Export failed — nothing was written."); }
  });
  const fileInput = document.getElementById("import-file");
  if (fileInput) fileInput.addEventListener("change", (ev) => {
    const file = ev.target.files && ev.target.files[0];
    ev.target.value = "";   // allow re-selecting the same filename later
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => tryImportText(String(reader.result));
    reader.onerror = () => showImportError("Could not read that file.");
    reader.readAsText(file);
  });
  const pasteBtn = document.getElementById("import-paste-btn");
  if (pasteBtn) pasteBtn.addEventListener("click", () => {
    const ta = document.getElementById("import-paste");
    tryImportText(ta ? ta.value : "");
  });
}

/* --------------------------- offline catch-up ---------------------------- */
// Rob's call (2026-08-01): on hitting a blocking choice we BANK the unspent
// time rather than discarding it. Resolving the choice spends the remainder,
// and may block again at the next gate — the morning becomes a chain of
// decisions, each followed by a burst of chronicle.

let catchupBusy = false;

function runCatchUp(totalMs, done){
  if (totalMs <= 0){ done("complete", 0); return; }
  catchupBusy = true;
  const chunkMs = CATCHUP_BATCH * TASK_DURATION * 1000;
  let remaining = totalMs;

  function step(){
    // The whole batch runs inside a try. Without it, ANY throw from the
    // simulation core escapes the setTimeout chain: no further step is
    // scheduled, catchupBusy stays true (which also disables the live loop),
    // and the last thing painted — the "Catching Up" card — is on screen
    // permanently with no way out. That exact hang shipped once, from an
    // unguarded thread lookup in arriveInZone(). A crash mid-catch-up should
    // cost the player the rest of the batch, never the session.
    let offer, left;
    try {
      offer = Math.min(chunkMs, remaining);
      left  = advance(S, offer);
    } catch (err){
      console.error("catch-up aborted", err);
      catchupBusy = false;
      S.world.bankedMs = 0;   // don't re-run the same crashing span on next load
      S.lastTick = Date.now();
      try { saveGame(); } catch(e){}
      done("error", Math.max(0, totalMs - remaining));
      return;
    }
    remaining -= (offer - left);
    if (left > 0){                       // blocked — hold the rest
      S.world.bankedMs = remaining;
      catchupBusy = false;
      done("blocked", totalMs - remaining);
      return;
    }
    if (remaining <= 0){
      S.world.bankedMs = 0;
      catchupBusy = false;
      done("complete", totalMs);
      return;
    }
    renderCatchupProgress(1 - remaining / totalMs, totalMs);
    setTimeout(step, 0);
  }
  step();
}

function snapshot(){
  return {level:S.hero.level, gold:S.hero.gold, zone:S.world.zone,
          tasks:S.stats.tasksCompleted, logLen:S.log.length};
}
function buildSummary(before, elapsedMs){
  const notable = S.log.slice(before.logLen).filter(e => e.imp >= 1);
  return {
    elapsedMs,
    tasks: S.stats.tasksCompleted - before.tasks,
    levelFrom: before.level, levelTo: S.hero.level,
    gold: S.hero.gold - before.gold,
    zoneFrom: before.zone, zoneTo: S.world.zone,
    // Generous cap — this feeds the categorized WYWA list, not a raw dump, so
    // it can afford to hold a full chained night's worth of notable beats.
    notable: notable.slice(-40),
  };
}

let pendingSummary = null;

function bootCatchUp(){
  const elapsedRaw = Date.now() - (S.lastTick || Date.now());
  const capped = Math.min(Math.max(0, elapsedRaw), MAX_OFFLINE_HRS * 3600 * 1000);
  const banked = S.world.bankedMs || 0;
  S.world.bankedMs = 0;
  const total = capped + banked;
  if (total < 5000 || S.world.state === "DEAD" || S.world.state === "ASCENDED"){
    S.lastTick = Date.now();
    S.world.clock = Date.now();
    render();
    startLiveLoop();
    return;
  }
  // Night events are stamped from the moment the hero was left alone, forward.
  if (!S.world.clock || S.world.clock > S.lastTick) S.world.clock = S.lastTick;
  const before = snapshot();
  renderCatchupProgress(0, total);
  runCatchUp(total, (why, spent) => {
    S.lastTick = Date.now();
    if (why === "complete") S.world.clock = Date.now();
    // Only surface a digest if something actually happened. Returning to a hero
    // who is already sitting on a blocking choice spends nothing, and without
    // this guard the morning opens on "0m on the road, 0 tasks completed".
    const sum = buildSummary(before, spent);
    pendingSummary = (sum.tasks > 0 || sum.levelTo > sum.levelFrom) ? sum : null;
    saveGame();
    render();
    startLiveLoop();
  });
}

// Called after the player resolves a blocking choice: spend what was banked.
function spendBanked(){
  const banked = S.world.bankedMs || 0;
  if (banked <= 0){ render(); return; }
  S.world.bankedMs = 0;
  const before = snapshot();
  renderCatchupProgress(0, banked);
  runCatchUp(banked, (why, spent) => {
    S.lastTick = Date.now();
    if (why === "complete") S.world.clock = Date.now();
    const sum = buildSummary(before, spent);
    // Fold into the existing card rather than replacing it, so a chain of
    // three choices still reads as one night.
    pendingSummary = pendingSummary ? mergeSummary(pendingSummary, sum) : sum;
    saveGame();
    render();
  });
}
function mergeSummary(a, b){
  return {elapsedMs: a.elapsedMs + b.elapsedMs, tasks: a.tasks + b.tasks,
          levelFrom: a.levelFrom, levelTo: b.levelTo, gold: a.gold + b.gold,
          zoneFrom: a.zoneFrom, zoneTo: b.zoneTo,
          notable: a.notable.concat(b.notable).slice(-40)};
}

/* ------------------------------- live loop ------------------------------- */

let liveTimer = null;
function startLiveLoop(){
  if (liveTimer) clearInterval(liveTimer);
  S.lastTick = Date.now();
  liveTimer = setInterval(tickLive, 250);
}
function tickLive(){
  if (!S || catchupBusy) return;
  const now = Date.now();
  const dt = now - S.lastTick;
  S.lastTick = now;
  if (dt <= 0) return;
  const before = S.world.state;
  const achBefore = (S._meta && S._meta.achievements) ? S._meta.achievements.length : 0;
  advance(S, Math.min(dt, 60000));
  const achAfter = (S._meta && S._meta.achievements) ? S._meta.achievements.length : 0;
  if (S.stats.tasksCompleted % 20 === 0 && S.world.taskProgressMs < 300) saveGame();
  // An achievement firing mid-tick is worth a full render (banner + chronicle
  // entry) immediately, not just on the next state change.
  if (S.world.state !== before || achAfter !== achBefore) { saveGame(); render(); }
  else renderLive();
}

/* --------------------------------- render -------------------------------- */

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Math.round(n).toLocaleString();
function fmtDur(ms){
  const h = Math.floor(ms/3600000), m = Math.round(ms%3600000/60000);
  if (h && m) return `${h}h ${m}m`;
  if (h) return `${h}h`;
  return `${m}m`;
}

let activeTab = "stats";
let metaView = null;          // null | "hall" | "achievements" — meta-scoped, outlives any hero
let retireConfirmOpen = false;
// Shown once before EACH hero's creation form (every hero is a new story), not
// just the first time the game is ever opened. Reset to false wherever a hero's
// story ends and S goes back to null (layrest / ascend-rest / retireHero), so
// it's armed again the next time render() finds no live hero.
let prologueSeen = false;

function render(){
  if (importConfirmPayload){ renderImportConfirm(); return; }
  if (metaView === "hall"){ renderHall(); return; }
  if (metaView === "achievements"){ renderAchievements(); return; }
  if (!S){
    if (!prologueSeen){ renderPrologue(); return; }
    renderCreation(); return;
  }
  if (retireConfirmOpen){ renderRetireConfirm(); return; }
  if (S.world.state === "DEAD"){ renderDeath(); return; }
  if (S.world.state === "ASCENDED"){ renderAscension(); return; }
  if (S.world.state === "AWAITING_CHOICE" && S.world.pendingChoice){ renderChoice(); return; }
  renderMain();
}

// A small atmospheric beat before the hero-creation form — one screen, no
// scroll, sets up the premise (you make them, then you let go) in the same
// grim, grounded voice as the TASKS/PERILS/ARRIVAL/EPILOGUES banks.
function renderPrologue(){
  app.innerHTML = `
    <div class="card">
      <h2>Before the Road</h2>
      <p class="muted tiny">You will give them a name, and a blood, and a direction. That is the whole of your part.</p>
      <p class="muted tiny">After that they walk out past where you can follow, and the road decides the rest —
        what they become, what they survive, what finally stops them. Come back when you can.
        The chronicle will be waiting, however it reads.</p>
      <button class="btn" id="prologue-continue" style="margin-top:10px">Make Your Hero</button>
    </div>`;
  document.getElementById("prologue-continue").addEventListener("click", () => {
    prologueSeen = true;
    render();
  });
}

// Small nav row shown on both the between-heroes creation screen and the
// live hero screen — Hall of Legends and Achievements are meta-scoped and
// outlive any single hero, so they get their own views rather than a 5th/6th
// tab bolted onto the hero-scoped tab bar. Real buttons (not text links) so
// they read as primary navigation and stay easy to tap on a phone.
function metaNavBar(){
  return `<div style="display:flex; gap:10px; margin-bottom:14px">
    <button class="btn ghost" id="nav-hall" type="button" style="flex:1; min-width:0">Hall of Legends</button>
    <button class="btn ghost" id="nav-ach" type="button" style="flex:1; min-width:0">Achievements</button>
  </div>`;
}
function wireMetaNav(){
  const h = document.getElementById("nav-hall");
  const a = document.getElementById("nav-ach");
  if (h) h.addEventListener("click", () => { metaView = "hall"; render(); });
  if (a) a.addEventListener("click", () => { metaView = "achievements"; render(); });
}
// Drains justUnlocked into a dismissible-looking (but self-clearing) card —
// achievements should be visible immediately, not just as a chronicle line
// the player has to go find.
function popJustUnlockedBanner(){
  if (!justUnlocked.length) return "";
  const keys = justUnlocked.slice();
  justUnlocked = [];
  return `<div class="card wywa"><h2>Achievement${keys.length > 1 ? "s" : ""} Unlocked</h2>
    <ul>${keys.map(k => `<li><b>${esc(ACHIEVEMENTS[k].name)}</b> — ${esc(ACHIEVEMENTS[k].reward)}</li>`).join("")}</ul>
  </div>`;
}

function renderCatchupProgress(frac, totalMs){
  app.innerHTML = `
    <div class="card">
      <h2>Catching Up</h2>
      <p class="muted tiny">Catching up on ${esc(fmtDur(totalMs))} of adventuring…</p>
      <div class="bar" style="margin-top:10px"><i style="width:${Math.round(frac*100)}%"></i></div>
    </div>`;
}

function renderCreation(){
  const races = Object.keys(RACES).filter(k => RACES[k].starter || (META.unlocks||{})[k]);
  app.innerHTML = `
    ${metaNavBar()}
    ${popJustUnlockedBanner()}
    <div class="card">
      <h2>A New Hero</h2>
      <p class="muted tiny">You choose their name and their blood. After that fate will determine their path.</p>
      <label for="hname">Name</label>
      <div style="display:flex; gap:8px">
        <input type="text" id="hname" maxlength="24" autocomplete="off" spellcheck="false" style="flex:1; min-width:0">
        <button class="btn ghost" id="rollname" type="button" style="width:auto; padding:0 14px">Roll</button>
      </div>
      <label>Race</label>
      <div id="racelist">${races.map(k => `
        <button class="pick" data-race="${k}" aria-pressed="false">
          <b>${esc(RACES[k].name)}</b>
          <span>${esc(modText(RACES[k].mods))} · <em>${esc(RACES[k].trait)}</em>: ${esc(RACES[k].traitText)}</span>
        </button>`).join("")}
      </div>
      <button class="btn" id="begin" disabled style="margin-top:8px">Begin the adventure</button>
    </div>
    ${saveDataRow()}`;

  wireMetaNav();
  wireSaveDataRow();
  let chosen = null;
  const nameEl = document.getElementById("hname");
  const beginEl = document.getElementById("begin");
  const refresh = () => { beginEl.disabled = !(chosen && nameEl.value.trim().length >= 2); };

  document.getElementById("rollname").addEventListener("click", () => {
    // Reacts to whatever race is selected AT THE MOMENT the button is pressed
    // (`chosen` is reassigned by the race-pick handler below, read here fresh
    // on every click) — generic bank if no race chosen yet, per-race bank once one is.
    nameEl.value = rollHeroName(META, chosen);
    refresh();
  });
  app.querySelectorAll("[data-race]").forEach(b => b.addEventListener("click", () => {
    chosen = b.dataset.race;
    app.querySelectorAll("[data-race]").forEach(o =>
      o.setAttribute("aria-pressed", String(o === b)));
    refresh();
  }));
  nameEl.addEventListener("input", refresh);
  beginEl.addEventListener("click", () => {
    // The previous hero's "While You Were Away" digest is still in
    // pendingSummary if the player never dismissed it — and after a death it
    // never gets dismissed, because the epilogue screen replaces the tab view.
    // Without this, a brand-new hero opens on the dead one's overnight recap.
    pendingSummary = null;
    S = createState(nameEl.value.trim().slice(0,24), chosen, META);
    META.heroesRun = (META.heroesRun || 0) + 1;
    // allRacesPlayed / fiftyHeroesRun bookkeeping — render-layer, same as
    // heroesRun above and the "Lay Them to Rest" handler, not the sim core,
    // since this is purely a player-driven creation-screen action.
    META.racesPlayed = META.racesPlayed || [];
    if (!META.racesPlayed.includes(chosen)) META.racesPlayed.push(chosen);
    saveMeta();
    if (Object.keys(RACES).every(r => META.racesPlayed.includes(r)))
      unlockAchievement(META, "allRacesPlayed", null);
    if (META.heroesRun >= 50) unlockAchievement(META, "fiftyHeroesRun", null);
    saveGame();
    render();
    startLiveLoop();
  });
}
function modText(mods){
  const parts = STAT_KEYS.filter(k => mods[k])
    .map(k => `${mods[k] > 0 ? "+" : ""}${mods[k]} ${k.toUpperCase()}`);
  return parts.length === 6 ? "+1 to all stats" : parts.join(", ");
}

function renderChoice(){
  const c = S.world.pendingChoice;
  const banked = S.world.bankedMs || 0;
  let heading, prompt, options;

  if (c.kind === "skill"){
    heading = "A New Discipline";
    prompt = `${esc(S.hero.name)} has learned enough to refine their craft. A path must be chosen.`;
    options = c.options.map(k => {
      const sk = SKILLS[k];
      return `<button class="pick" data-opt="${k}">
          <b>${esc(sk.name)}</b>
          <span>${esc(sk.blurb)}</span>
        </button>`;
    }).join("");
  } else if (c.kind === "dilemma"){
    // Situation and option texts were resolved ONCE, at the moment the gate
    // fired (see beginDilemma()) — c.variantIdx makes that stable across a
    // reload, same pattern as w.epilogueIdx. fillTemplate() substitutes
    // {name}/{antagonist} the same way every other story string does.
    const dil = DILEMMAS[c.dilemmaKey];
    heading = dil.title;
    prompt = esc(fillTemplate(dil.variants[c.variantIdx], threadVars(S)));
    options = c.options.map(k => {
      const o = dil.options[k];
      return `<button class="pick" data-opt="${k}">
          <b>${esc(o.label)}</b>
          <span>${esc(fillTemplate(o.desc, threadVars(S)))}</span>
        </button>`;
    }).join("");
  } else {   // class / class2
    heading = "The Road Forks";
    prompt = `${esc(S.hero.name)} has reached level ${S.hero.level}. A path must be chosen.`;
    options = c.options.map(k => {
      const cl = CLASSES[k];
      return `<button class="pick" data-opt="${k}">
          <b>${esc(cl.name)}</b>
          <span class="flavor">${esc(cl.flavor)}</span>
          <span class="philosophy">${esc(cl.philosophy)}</span>
          <span class="statline">${esc(weightText(cl.weights))}</span>
        </button>`;
    }).join("");
  }

  app.innerHTML = `
    <div class="modal"><div class="card">
      <h2>${esc(heading)}</h2>
      <p class="muted tiny" style="margin-top:0">
        ${prompt}
        ${banked > 5000 ? `<br><span class="gold">${esc(fmtDur(banked))} of the adventure awaits your choice.</span>` : ""}
      </p>
      <div style="margin-top:12px">${options}</div>
    </div></div>`;
  app.querySelectorAll("[data-opt]").forEach(b => b.addEventListener("click", () => {
    resolveChoice(S, b.dataset.opt);

// Hall of Legends — every hero who has left the road, one way or another.
// The one place a player sees their whole history (design doc's keepsake
// screen); capped at HALL_MAX so localStorage can't grow without bound over
// a long-lived player. Sort/status-filter selection (item 1, 2026-08-14
// brief) lives in module-level state, same idiom as chronicleFilters —
// render-only, never persisted, never touching META itself.
const HALL_SORTS = [
  {key:"newest", label:"Newest"},
  {key:"oldest", label:"Oldest"},
  {key:"level",  label:"Level"},
  {key:"hours",  label:"Hours Lived"},
  {key:"name",   label:"Name"},
];
let hallSort = "newest";
const HALL_STATUSES = ["Fallen", "Legend", "Retired"];
let hallStatusFilter = new Set(HALL_STATUSES);   // all on by default — same as the old unfiltered list

// Hall entries span several schema versions and are NOT guaranteed to carry
// `at`, `hoursLived`, `classPath` or `graveId` (older records predate those
// fields). Missing `at` falls back to 0 (chronologically "oldest possible" —
// `at` was only added once timestamps existed, so an entry that lacks it IS
// the oldest kind of record); missing `hoursLived`/`level` fall back to 0
// (numerically smallest, so incomplete data sinks rather than floating to
// the top). None of that can throw: every accessor here is `e.field || 0`
// or a String() coercion, never a direct property chain.
// Base list is newest-push-first (mirrors the old always-reverse() behavior)
// so that Array.sort's stability keeps ties — e.g. a pile of legacy entries
// that all fall back to at:0 — in newest-first order under every sort mode,
// rather than shuffling on each render.
function hallFilterAndSort(hall){
  const base = hall.slice().reverse();
  const filtered = hallStatusFilter.size === HALL_STATUSES.length
    ? base   // all three selected — pass through so unrecognized/missing status still shows
    : base.filter(e => hallStatusFilter.has(e.status));
  const list = filtered.slice();
  switch (hallSort){
    case "oldest": list.sort((a, b) => (a.at || 0) - (b.at || 0)); break;
    case "level":  list.sort((a, b) => (b.level || 0) - (a.level || 0)); break;
    case "hours":  list.sort((a, b) => (b.hoursLived || 0) - (a.hoursLived || 0)); break;
    case "name":   list.sort((a, b) => String(a.name || "").localeCompare(String(b.name || ""))); break;
    case "newest":
    default:       list.sort((a, b) => (b.at || 0) - (a.at || 0)); break;
  }
  return list;
}
function renderHall(){
  const entries = hallFilterAndSort(META.hall);
  const rows = entries.length
    ? entries.map(hallRow).join("")
    : `<div class="empty">No one has yet returned from the road, one way or another.</div>`;
  app.innerHTML = `
    <div class="card">
      <h2>Hall of Legends</h2>
      <p class="muted tiny">Every hero who has left the road — fallen, ascended, or retired.</p>
      <p class="tiny muted" style="margin:12px 0 4px">Sort by</p>
      <div class="chipbar" style="margin-bottom:4px">${HALL_SORTS.map(s => `
        <button class="chip" type="button" data-hallsort="${s.key}" aria-pressed="${hallSort === s.key}">${esc(s.label)}</button>`).join("")}</div>
      <p class="tiny muted" style="margin:8px 0 4px">Status</p>
      <div class="chipbar" style="margin-bottom:0">${HALL_STATUSES.map(st => `
        <button class="chip" type="button" data-hallstatus="${st}" aria-pressed="${hallStatusFilter.has(st)}">${esc(st)}</button>`).join("")}</div>
    </div>
    <div class="card">${rows}</div>
    <button class="btn ghost" id="hall-back">Back</button>`;
  document.getElementById("hall-back").addEventListener("click", () => { metaView = null; render(); });
  app.querySelectorAll("[data-hallsort]").forEach(b => b.addEventListener("click", () => {
    hallSort = b.dataset.hallsort; render();
  }));
  app.querySelectorAll("[data-hallstatus]").forEach(b => b.addEventListener("click", () => {
    const st = b.dataset.hallstatus;
    if (hallStatusFilter.has(st)) hallStatusFilter.delete(st); else hallStatusFilter.add(st);
    render();
  }));
}
// Grave/heirloom status line (item 4 of the 2026-08-03 brief) — pre-existing
// Fallen entries predate grave-tracking and simply have no graveId, so they
// fall through to no line at all rather than a broken lookup.
function hallGraveLine(e){
  if (e.graveId == null) return "";
  const grave = (META.graves || []).find(g => g.id === e.graveId);
  if (!grave) return "";
  const status = grave.heirloom
    ? (grave.heirloomRecovered ? "Their heirloom has been recovered." : "Their heirloom still waits to be found.")
    : "A grave marks where they fell.";
  return `<div class="tiny muted" style="margin-top:2px">${esc(status)}</div>`;
}
function hallRow(e){
  const statusColor = {Fallen: "var(--blood)", Legend: "var(--gold)", Retired: "var(--sky)"}[e.status] || "var(--ink-dim)";
  const path = (e.classPath && e.classPath.length)
    ? e.classPath.join(" &rarr; ")
    : esc(CLASSES[e.cls] ? CLASSES[e.cls].name : e.cls);

  const hours = typeof e.hoursLived === "number" ? e.hoursLived : 0;

// Progress detail for achievements that have real tracked data behind them.
// Deliberately only these five keys — the rest (actII/actIII/level40/
// legendaryFound/ascendOnce) are genuinely binary with nothing in META to
// measure against, so they stay un-expandable rather than faking a counter.
// Every META read here is defensive (old saves may predate a field —
// migrateMeta backfills, but this renders before boot-order is a safe bet
// to lean on) and achRareSetHtml tolerates S === null (the achievements
// screen is reachable from the creation screen, before any hero exists).
function achBarRow(label, value, target){
  const shown = Math.max(0, Math.min(value, target));
  return `<div class="ach-bar-row">
      <div class="ach-bar-label"><span>${esc(label)}</span><span>${fmt(value)} / ${fmt(target)}</span></div>
      <div class="bar"><i style="width:${pct(shown, target)}"></i></div>
    </div>`;
}
function achClassesBody(classesReached){
  const groups = Object.keys(ADVANCED_OF).map(t1 => {
    const chips = ADVANCED_OF[t1].map(ck => {
      const got = classesReached.includes(ck);
      const mark = got ? `<span class="ach-check" aria-hidden="true">&#10003;</span> ` : "";
      return `<span class="chip${got ? " reached" : ""}">${mark}${esc(CLASSES[ck].name)}</span>`;
    }).join("");
    return `<div class="ach-lineage">${esc(CLASSES[t1].name)}</div><div class="ach-chiprow">${chips}</div>`;
  }).join("");
  return groups + achBarRow("Classes reached", classesReached.length, 12);
}
function achRareSetBody(){
  if (!S) return `<p class="tiny muted" style="margin:0">Create a hero and gear them up to track this one.</p>`;
  let have = 0;
  const chips = SLOT_KEYS.map(slot => {
    const item = S.gear[slot];
    const qualifies = !!item && (item.tier === "rare" || item.tier === "epic" || item.tier === "legendary");
    if (qualifies) have++;
    const mark = qualifies ? `<span class="ach-check" aria-hidden="true">&#10003;</span> ` : "";
    const label = item ? `${cap(slot)} &middot; ${cap(item.tier)}` : `${cap(slot)} &middot; empty`;
    const style = qualifies ? ` style="border-color:var(--tier-${item.tier}); color:var(--tier-${item.tier})"` : "";
    return `<span class="chip${qualifies ? " reached" : ""}"${style}>${mark}${label}</span>`;
  }).join("");
  return `<div class="ach-chiprow">${chips}</div>` + achBarRow("Rare-or-better slots", have, 6);
}
// allRacesPlayed — same chip idiom as achClassesBody, flat (one lineage
// group, not several) since there's no grouping structure for races.
function achRacesBody(racesPlayed){
  const chips = Object.keys(RACES).map(rk => {
    const got = racesPlayed.includes(rk);
    const mark = got ? `<span class="ach-check" aria-hidden="true">&#10003;</span> ` : "";
    return `<span class="chip${got ? " reached" : ""}">${mark}${esc(RACES[rk].name)}</span>`;
  }).join("");
  return `<div class="ach-chiprow">${chips}</div>` + achBarRow("Races played", racesPlayed.length, Object.keys(RACES).length);

// ascendAllLineages — one chip per tier-1 lineage.
function achLineagesBody(ascendedLineages){
  const chips = Object.keys(ADVANCED_OF).map(t1 => {

  }).join("");
  return `<div class="ach-chiprow">${chips}</div>` + achBarRow("Lineages ascended", ascendedLineages.length, Object.keys(ADVANCED_OF).length);

function achievementProgressBody(key){
  const m = META || {};
  switch(key){
    case "longRecord":
      return achBarRow("Tasks completed", typeof m.lifetimeTasks === "number" ? m.lifetimeTasks : 0, 25000);
    case "tenHeroesRest":
      return achBarRow("Heroes laid to rest", typeof m.heroesLaidToRest === "number" ? m.heroesLaidToRest : 0, 10);
    case "ascendThrice":
      return achBarRow("Ascensions", typeof m.ascensionCount === "number" ? m.ascensionCount : 0, 3);
    case "allAdvancedClasses":
      return achClassesBody(Array.isArray(m.classesReached) ? m.classesReached : []);

      return achRareSetBody();

    case "heirloomRecoverer":

    case "fiftyHeroesRun":

    default:
