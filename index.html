<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chronicles RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#14110f; --bg2:#1c1815; --panel:#221d19; --line:#3a322b;
  --ink:#e8dcc8; --ink-dim:#a1907a; --ink-mute:#6f6355;
  --gold:#c9a227; --gold-lit:#e8c25a;
  --blood:#a33b32; --leaf:#6f9a5c; --sky:#5b87b8;
  /* headline family only — wordmark, section headings, title rule. --gold
     keeps sole ownership of loot/currency/tier semantics; do not repaint it. */
  --head:#7cbf85;
  /* gear quality tiers — design doc §9, exact hex values */
  --tier-common:#9ca3af; --tier-uncommon:#4ade80; --tier-rare:#60a5fa;
  --tier-epic:#c084fc; --tier-legendary:#fbbf24;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:Inter,system-ui,sans-serif; font-size:15px; line-height:1.5;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:620px; margin:0 auto; padding:16px 14px 64px}
h1,h2,h3{font-family:Cinzel,Georgia,serif; font-weight:700; margin:0}
.title{text-align:center; letter-spacing:.22em; font-size:26px; color:var(--head);
  padding:12px 0 4px; text-transform:uppercase}
.title-rule{height:1px; background:linear-gradient(90deg,transparent,var(--head) 20%,var(--head) 80%,transparent); margin:0 0 18px; opacity:.55}

.card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px}
.card h2{font-size:15px; letter-spacing:.12em; text-transform:uppercase; color:var(--head); margin-bottom:10px}
.muted{color:var(--ink-dim)}
.tiny{font-size:12.5px}

/* bars */
.bar{height:9px; background:#0e0b09; border:1px solid var(--line); border-radius:5px; overflow:hidden}
.bar > i{display:block; height:100%; background:var(--leaf); transition:width .25s linear}
.bar.hp > i{background:linear-gradient(90deg,#8c2f28,#c04a3e)}
.bar.xp > i{background:linear-gradient(90deg,#7a5f16,var(--gold))}
.bar.task > i{background:linear-gradient(90deg,#3f5f7f,var(--sky))}
.barrow{display:grid; grid-template-columns:34px 1fr auto; gap:9px; align-items:center; margin:7px 0; font-size:12.5px}
.barrow b{color:var(--ink-dim); font-weight:500; letter-spacing:.06em}
.barrow span{color:var(--ink-dim); white-space:nowrap}

.heroline{font-family:Cinzel,serif; font-size:19px; color:var(--ink)}
.herosub{font-size:13px; color:var(--ink-dim); margin-top:2px}
.footrow{display:flex; justify-content:space-between; align-items:center; margin-top:11px;
  padding-top:10px; border-top:1px solid var(--line); font-size:13px}
.zonedot{color:var(--leaf)}
.gold{color:var(--gold)}

/* tabs */
.tabs{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:12px}
.tabs button{
  font:inherit; font-size:13px; letter-spacing:.05em; padding:10px 4px; cursor:pointer;
  background:var(--bg2); color:var(--ink-dim); border:1px solid var(--line); border-radius:8px;
}
.tabs button[aria-selected="true"]{background:var(--panel); color:var(--gold); border-color:var(--gold)}

/* stats */
.statgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px 14px}
.stat{display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--line)}
.stat b{font-weight:500; color:var(--ink-dim)}
.stat i{font-style:normal; font-variant-numeric:tabular-nums}
.effects{margin-top:12px; font-size:12.5px; color:var(--ink-dim)}
.effects div{padding:3px 0}

/* gear */
.gearlist{display:flex; flex-direction:column}
.gearslot{padding:9px 0; border-bottom:1px solid var(--line)}
.gearslot:last-child{border-bottom:none}
.gearslot b{display:block; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-mute)}
.itemname{font-family:Cinzel,serif; font-size:14.5px; margin-top:2px}

/* learned skills — a record of what the hero has become, not disabled UI, so
   they get a proper readable title tone instead of inheriting .gearslot's
   muted uppercase slot-label style (which is what made them fade out). */
.skill-row{padding:9px 0; border-bottom:1px solid var(--line)}
.skill-row:last-child{border-bottom:none}
/* Skill names must NOT share the headline treatment. .card h2 ("Path",
   "Skills") is uppercase, letter-spaced and --head green; a skill name in the
   same colour and face reads as another section header rather than content.
   Parchment --ink, no uppercase, no tracking: clearly a title, clearly not a
   heading, and still well above the --ink-dim blurb beneath it. */
.skill-row .skill-title{display:block; font-family:Cinzel,serif; font-size:15px;
  color:var(--ink); letter-spacing:.01em; text-transform:none}

/* chronicle — sessions (real sittings, by time-gap) each hold chapter breaks
   (zone arrivals) and entries. Rendered strict newest-first throughout: newest
   sitting on top, and within it entries run newest-to-oldest, so the very top
   line is always the most recent thing that happened. */
.log{display:flex; flex-direction:column}
.session-head{display:flex; align-items:center; gap:10px; margin:22px 0 12px;
  color:var(--ink-mute); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase}
.session:first-child .session-head{margin-top:0}
.session-head::before, .session-head::after{content:""; flex:1; height:1px; background:var(--line)}

/* chapter break — a zone arrival (Act transition), the chronicle's chapter headers */
.chapter{text-align:center; margin:26px 0 18px; padding:0 4px}
.chapter .chapter-rule{height:1px; margin:0 auto 12px; max-width:140px;
  background:linear-gradient(90deg,transparent,var(--gold) 30%,var(--gold) 70%,transparent)}
.chapter b{display:block; font-family:Cinzel,serif; font-size:16.5px; letter-spacing:.06em;
  color:var(--gold-lit); overflow-wrap:anywhere}
.chapter span{display:block; font-size:12.5px; color:var(--ink-dim); margin-top:7px;
  font-family:Inter,sans-serif; line-height:1.65; overflow-wrap:anywhere}

.entry{padding:5px 0; border-bottom:1px solid #2a241f; font-size:13.5px; color:var(--ink-mute);
  overflow-wrap:anywhere}
.entry time{color:#4d443a; font-variant-numeric:tabular-nums; margin-right:8px; font-size:12px}
.entry.imp0{font-size:12.5px; opacity:.75}
.entry.imp1{color:var(--ink)}
.entry.imp2{color:var(--ink); background:#1a1613; border-left:2px solid var(--gold);
  padding:10px 12px; margin:8px 0; border-bottom:none; border-radius:0 6px 6px 0;
  font-family:Cinzel,serif; font-size:14px; line-height:1.6}
.entry.imp2 time{display:block; margin:0 0 4px; font-family:Inter,sans-serif}

/* weight for the entries that matter most — death/ascension carry the most,
   cheat-death and rare drops catch the eye via the tier colors already defined */
.entry.k-death{border-left-color:var(--blood); background:#201412}
.entry.k-ascension{border-left-color:var(--gold-lit); background:#241d10;
  box-shadow:0 0 0 1px rgba(232,194,90,.18) inset}
.entry.k-cheatdeath{border-left-color:var(--blood)}
/* near-death is imp1 (a plain line, not a bordered imp2 card) but still
   needs to catch the eye per spec — a left accent without the full card
   treatment keeps it a step below cheat-death/death in weight. */
.entry.imp1.k-neardeath{border-left:2px solid var(--blood); padding-left:9px}
.entry.k-confrontation{border-left-color:var(--blood)}
.entry.k-achievement{border-left-color:var(--gold-lit); color:var(--gold-lit)}
.entry.k-gear-epic{border-left-color:var(--tier-epic); color:var(--tier-epic)}
.entry.k-gear-legendary{border-left-color:var(--tier-legendary); color:var(--tier-legendary)}
/* graves & heirlooms (persistent world) — an elegiac beat gets the same
   blood accent as death/cheat-death (it IS a death, just not this hero's);
   a recovered heirloom is a loot moment, so it reads like k-achievement. */
.entry.k-grave{border-left-color:var(--blood)}
.entry.k-heirloom{border-left-color:var(--gold-lit); color:var(--gold-lit)}

/* buttons + choices */
.btn{display:block; width:100%; font:inherit; font-size:15px; padding:13px; cursor:pointer;
  background:var(--gold); color:#1a1510; border:none; border-radius:8px; font-weight:600;
  letter-spacing:.04em}
.btn.ghost{background:transparent; color:var(--ink-dim); border:1px solid var(--line)}
.btn:disabled{opacity:.4; cursor:default}
.pick{display:block; width:100%; text-align:left; font:inherit; cursor:pointer; margin-bottom:9px;
  background:var(--bg2); color:var(--ink); border:1px solid var(--line); border-radius:9px; padding:13px}
.pick[aria-pressed="true"]{border-color:var(--gold); background:#241f18}
.pick b{display:block; font-family:Cinzel,serif; font-size:15px; color:var(--gold-lit); margin-bottom:3px}
.pick span{display:block; font-size:12.5px; color:var(--ink-dim)}
/* Class choice (renderChoice, kind class/class2) splits the old single blurb
   into two skimmable lines: .flavor (who they are, in voice — same dim tone
   as every other .pick span) and .philosophy (what playing it is actually
   like — --sky, the palette's existing "practical/informational" accent, so
   it reads as the actionable line at a glance without adding a new colour).
   .statline keeps the old weightText() stat-focus summary, deprioritized to
   --ink-mute since .philosophy already carries the practical read. */
.pick .flavor{font-style:italic; margin-bottom:5px}
.pick .philosophy{color:var(--sky); margin-bottom:4px}
.pick .statline{color:var(--ink-mute); font-size:11.5px; letter-spacing:.02em}

/* achievement rows — earned mirrors .pick[aria-pressed] (border + background
   tint), the same "this is the chosen/won one" language already used at hero
   creation, so an earned achievement reads as won at a glance rather than
   just carrying different text. Titles get their own class (not .gearslot's
   small uppercase label) since a row here is a title, not a slot name. */
.ach-row{background:var(--bg2); border:1px solid var(--line); border-radius:9px;
  padding:12px 13px; margin-bottom:9px}
.ach-row:last-child{margin-bottom:0}
.ach-row .ach-title{display:block; font-family:Cinzel,serif; font-size:15px;
  margin-bottom:3px; color:var(--head)}
.ach-row.earned{background:#241f18; border-color:var(--gold-lit)}
.ach-row.earned .ach-title{color:var(--gold-lit)}
.ach-check{color:var(--gold-lit)}

/* achievement progress detail — native <details>/<summary> (accessible,
   no JS) restyled to match the card language instead of browser defaults.
   The summary IS the toggle, so it gets a full-width tap target rather than
   relying on a tiny disclosure triangle. */
.ach-progress{margin-top:10px; border-top:1px solid var(--line)}
.ach-progress summary{cursor:pointer; list-style:none; display:flex; align-items:center;
  justify-content:space-between; gap:8px; padding:13px 2px; font-size:12px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--ink-dim);
  -webkit-tap-highlight-color:transparent}
.ach-progress summary::-webkit-details-marker{display:none}
.ach-progress summary::after{content:"+"; font-family:Cinzel,serif; font-size:16px;
  line-height:1; color:var(--ink-mute)}
.ach-progress[open] summary::after{content:"\2212"}
.ach-progress-body{padding:0 2px 11px}
.ach-bar-row + .ach-bar-row{margin-top:10px}
.ach-bar-label{display:flex; justify-content:space-between; gap:10px; font-size:12.5px;
  color:var(--ink-dim); margin-bottom:5px}
.ach-bar-label span:last-child{white-space:nowrap; font-variant-numeric:tabular-nums}
.ach-lineage{font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-mute); margin:10px 0 5px}

/* Save Data card — collapsible from the title, closed by default (Rob,
   2026-08-07). The whole element is a <details> standing in for the usual
   .card div, and <summary> stands in for .card h2 (same font/tracking/color)
   so the section reads identically to every other card until it's tapped
   open. Reuses the .ach-progress +/- disclosure language rather than the
   browser's default triangle. */
details.save-data > summary{cursor:pointer; list-style:none; display:flex;
  align-items:center; justify-content:space-between; gap:8px;
  font-size:15px; letter-spacing:.12em; text-transform:uppercase; color:var(--head);
  -webkit-tap-highlight-color:transparent}
details.save-data > summary::-webkit-details-marker{display:none}
details.save-data > summary::after{content:"+"; font-family:Cinzel,serif; font-size:18px;
  line-height:1; color:var(--ink-mute)}
details.save-data[open] > summary::after{content:"\2212"}
details.save-data[open] > summary{margin-bottom:10px}
.ach-lineage:first-child{margin-top:0}
.ach-chiprow{display:flex; flex-wrap:wrap; gap:6px}
.ach-chiprow .chip{cursor:default}
.ach-chiprow .chip.reached{border-color:var(--gold-lit); color:var(--ink); background:#241f18}

.modal{position:fixed; inset:0; background:rgba(8,6,5,.86); display:flex; align-items:center;
  justify-content:center; padding:16px; z-index:50; overflow-y:auto}
.modal .card{max-width:520px; width:100%; margin:auto}

label{display:block; font-size:12.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-dim); margin:14px 0 6px}
input[type=text]{width:100%; font:inherit; font-size:16px; padding:11px; background:var(--bg2);
  color:var(--ink); border:1px solid var(--line); border-radius:8px}
input[type=text]:focus{outline:none; border-color:var(--gold)}
/* Save Data row (import/export) — same tokens as input[type=text]/.pick, just
   applied to the two native controls that don't get styling by default. */
input[type=file]{display:block; width:100%; max-width:100%; font:inherit; font-size:13px;
  color:var(--ink-dim); background:var(--bg2); border:1px solid var(--line); border-radius:8px;
  padding:10px}
input[type=file]:focus{outline:none; border-color:var(--gold)}
textarea{width:100%; font:inherit; font-size:12.5px; padding:10px; background:var(--bg2);
  color:var(--ink); border:1px solid var(--line); border-radius:8px; resize:vertical}
textarea:focus{outline:none; border-color:var(--gold)}

.wywa{border-color:var(--gold)}
.wywa ul{margin:8px 0 0; padding-left:18px; font-size:13.5px}
.wywa li{padding:2px 0}
.wywa-notable{margin-top:10px; padding-top:10px; border-top:1px solid var(--line);
  display:flex; flex-direction:column; gap:6px}
.wn-item{font-size:13px; color:var(--ink-dim); padding-left:11px; position:relative; line-height:1.5;
  overflow-wrap:anywhere}
.wn-item::before{content:""; position:absolute; left:0; top:.55em; width:5px; height:5px;
  border-radius:50%; background:var(--ink-mute)}
.wn-item.k-death::before, .wn-item.k-cheatdeath::before, .wn-item.k-confrontation::before, .wn-item.k-neardeath::before, .wn-item.k-grave::before{background:var(--blood)}
.wn-item.k-ascension::before, .wn-item.k-achievement::before, .wn-item.k-heirloom::before{background:var(--gold-lit)}
.wn-item.k-gear-epic::before{background:var(--tier-epic)}
.wn-item.k-gear-legendary::before{background:var(--tier-legendary)}
.wywa-status{margin:10px 0 0; padding-top:9px; border-top:1px solid var(--line); font-size:13px}
.chipbar{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px}
.chip{font:inherit; font-size:12.5px; padding:8px 13px; cursor:pointer; background:var(--bg2);
  color:var(--ink-dim); border:1px solid var(--line); border-radius:999px; letter-spacing:.02em}
.chip[aria-pressed="true"]{border-color:var(--gold); color:var(--ink); background:#241f18}
/* WYWA's Dismiss control — a real button in the .btn.ghost idiom (not a
   styled hyperlink), with the same touch target every other full-width
   button gets. .dismiss is only ever used here, alongside .btn.ghost, so it
   just adds the spacing this particular placement needs. */
.dismiss{margin-top:10px}
.empty{color:var(--ink-mute); font-size:13.5px; text-align:center; padding:22px 0}

/* restrained motion — respected always; the only things that ever move are a
   fresh WYWA card, the newest chronicle line, and a level-up. Nothing here
   runs on the 250ms live tick. */
@media (prefers-reduced-motion: no-preference){
  .wywa-in{animation:cardIn .5s ease-out}
  /* Chronicle now renders strict newest-first, so the newest entry in the
     newest sitting is the first child, not the last — see chronicleSessions(). */
  .session:first-child > .entry:first-child,
  .session:first-child > .chapter:first-child{animation:entryIn .5s ease-out}
  .heroline.levelup{animation:levelFlash 1.2s ease-out}
  @keyframes cardIn{from{opacity:0; transform:translateY(-6px)} to{opacity:1; transform:none}}
  @keyframes entryIn{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}
  @keyframes levelFlash{
    0%{text-shadow:0 0 0 rgba(232,194,90,0)}
    35%{text-shadow:0 0 16px rgba(232,194,90,.85)}
    100%{text-shadow:0 0 0 rgba(232,194,90,0)}
  }
}

/* mobile — Rob reads this on a phone in the morning; single column already,
   this just tightens the tab bar and title so nothing wraps or overflows
   down at 375px. No horizontal scroll anywhere, at any width. */
@media (max-width:400px){
  .wrap{padding:12px 10px 56px}
  .title{font-size:21px; letter-spacing:.14em}
  .tabs{gap:5px}
  .tabs button{font-size:11.5px; padding:13px 2px; letter-spacing:.02em}
  .heroline{font-size:17px}
  .card{padding:12px}
}
html, body{overflow-x:hidden; max-width:100%}
</style>

<div class="wrap">
  <h1 class="title">Chronicles RPG</h1>
  <div class="title-rule"></div>
  <div id="app"></div>
</div>

<script>
"use strict";
/* ============================================================================
   CHRONICLES RPG — single-file idle RPG.
   Phase 1 (skeleton) + Phase 2 (offline catch-up + headless harness).

   ARCHITECTURE RULE, load-bearing for everything that comes later:
   the simulation core below (advance / completeTask / levelUp / derived) NEVER
   touches the DOM and never reads wall-clock time. It mutates a state object
   passed to it and takes randomness from a swappable `rng`. That is what makes
   simulate(1000) possible. Later phases (perils, gear, skills, story) must add
   their logic INSIDE that core, not in the render layer.
   ========================================================================= */

/* ---------------------------------- data --------------------------------- */

const SAVE_KEY = "goquest_hero";
const META_KEY = "goquest_meta";
const SAVE_VERSION = 9;
const META_VERSION = 4;

const TASK_DURATION   = 25;      // seconds, before STR reduction
const TRAVEL_SECONDS  = 90;      // zone change
const MERCHANT_SECONDS = 60;     // each leg of a merchant trip (there and back)
const INVENTORY_SLOTS  = 12;
const MAX_OFFLINE_HRS = 48;
const CATCHUP_BATCH   = 200;     // tasks per setTimeout slice
const LOG_ROUTINE_MAX = 300;
const SKILL_LEVELS = [5, 15, 20, 30, 35, 40, 45, 50];   // design doc §8 acquisition levels

// Every number the death curve is sensitive to lives here so the harness can
// sweep them. Change balance HERE, never at the call site.
const BALANCE = {
  regenBase:    0.006,   // fraction of maxHP regenerated per task
  regenConDiv:  60,      // CON's extra multiplier on regen: (1 + min(CON,cap)/div)
  regenConCap:  60,      // ...CON above this stops helping. The cap is the point.
  gearBudget:   0.18,    // stat points per point of itemScore
  merchantHeal: 1.00,    // fraction of maxHP restored by a merchant trip
  perilDmgMult: 3.10,    // global scalar on the zone damage ranges
  perilChanceMult: 1.00, // global scalar on the zone peril frequencies
  xpCurveMult:  1.45,    // scalar on xpToNext — the arc-length knob
  evasionCap:   0.50,    // DEX stops buying evasion here. Raising it is what
                         // gives the DEX classes defensive scaling at all —
                         // past the cap, DEX is a dead stat defensively.
  dmgHpBlend:   0.35,    // 1 = damage is % of the hero's OWN maxHP (design doc
                         // as written); 0 = % of a level-referenced HP pool.
                         // See the note below — this one is a design decision.
  skillMitigationCap: 0.60, // stacked mitigation skills can't reduce peril dmg past this
  skillTaskSpeedFloor: 0.50,// stacked task-speed skills can't cut task time past this fraction
  skillBuyMultFloor:   0.40,// stacked buy-discount skills can't cut merchant prices past this

  // --- Gold economy (design doc §9 merchant trips). Zone `gold` income climbs
  // ~40x zone1->zone6 while itemScore (and so unadjusted price) only climbed
  // ~3-4x, so prices fell further and further behind income the deeper a hero
  // got — by zone 4 one merchant cycle's income was 7.6x the cost of a full
  // re-kit. See doMerchantTrip() for how these combine. ---
  buyPriceMult:  6,     // base merchant buy price per point of itemScore (was a bare literal)
  sellPriceMult: 2,     // base sell value per point of itemScore (was a bare literal)
  priceZoneExp:  1.00,  // curve exponent on (zone.gold / ZONES[0].gold) — re-anchors price to
                        // the SAME curve income already climbs, so gold becomes a real
                        // constraint deep in the run without turning it into a wall.
                        // Measured at 1.0: spend-per-cycle rises from ~11% of income (zone 1,
                        // unchanged — it's the reference zone) to ~31-39% of income (zones 3-6),
                        // up from ~10-15% before this change, with zero heroes stranded unable
                        // to afford the L48+ relic guarantee.
  merchantMaxBuys: 4,   // cap on upgrade purchases per merchant trip — the merchant now keeps
                        // buying weakest-slot upgrades while they're affordable and genuine,
                        // but a rich hero re-kits, not re-kits forever
  commissionPriceMult: 5.0, // premium over an ordinary purchase for guaranteeing a specific
                            // slot's tier instead of hoping stock rolls well
  commissionTier: "epic",   // Guaranteed floor tier a commission buys, and the single most
                            // important number in the economy. Repricing alone did NOT make
                            // gold scarce (surplus at death actually ROSE to 258k): the
                            // merchant's real bottleneck was never price, it was that rolled
                            // stock rarely beats gear a hero already owns after 200+ drops.
                            // Only quality the hero cannot get from drops absorbs the surplus —
                            // at "epic" it falls to ~75k. Note the curve is not monotonic:
                            // "legendary" at 14x leaves MORE gold than "epic" at 5x, because
                            // a price that steep means the hero commissions far less often.
                            // Commissioning still cannot satisfy the ascension gate — the
                            // relic slot is skipped while that guarantee is pending.

  // --- Phase 6: the final confrontation. New knobs, none of the above
  // touched — the lead tunes these independently of the regular death curve. ---
  // Tuned so the confrontation culls level-50 heroes from ~12.8% reaching the
  // gate to ~6.7% ascending — the middle of the design doc's 5-10% target.
  confrontPerilChance: 0.50,   // per-step peril chance during the confrontation (zone6 is 12%)
  confrontDmgMin: 0.60,        // min fraction of the blended HP pool (refHP/maxHP) per hit
  confrontDmgMax: 0.90,        // max fraction of the blended HP pool per hit
  confrontRegenMult: 0.30,     // partial regen between confrontation steps — no merchant heal mid-fight
  confrontRelicLegendaryChance: 0.15, // odds the guaranteed L48+ relic rolls legendary instead of epic
};
/* Why peril damage references a level-typical HP pool instead of the hero's own:
   The doc (§7) makes damage a percentage of maxHP so the danger curve stays
   stable as HP scales. It does — but it also means a hero's own maxHP is
   worthless defensively, since bigger pool and bigger hits cancel exactly. That
   silently deletes Constitution as a survival stat, and with it the doc's
   central tension (§4). Measured with pure %maxHP: Apprentices out-survived
   Soldiers 59% to 29% — INT was strictly dominant, being both faster per level
   (fewer tasks) and no more dangerous.
   Referencing a level-typical pool keeps the curve indexed on one number per
   zone (the doc's actual goal) while making CON's extra HP genuinely absorb
   hits. INT still races; CON now actually survives. */
function refHP(level){ return 114 + 14.4 * level; }
/* Why the CON regen term is CAPPED rather than raw or removed:
   maxHP already contains CON*8, and peril damage is a percentage of maxHP, so
   an uncapped (1 + CON/40) makes regen scale with CON^2 while incoming damage
   scales linearly. Gear pushed CON to ~206 and regen to 89 HP/task against 28
   of damage — nothing could die.
   But removing the term entirely goes too far the other way: when damage AND
   regen are both percentages of maxHP, extra maxHP buys nothing and CON becomes
   mechanically inert. Measured: Apprentices then out-survived Soldiers 49 to 14,
   inverting the design doc's central tension (§4).
   Capping keeps CON a real survivability stat over its natural range while
   denying gear the runaway. Protect this relationship during future tuning. */

// ONLY pool rollThread() draws from when meta.unlocks.antagonistHunt is
// absent (which includes every simulate(n) run, meta always null there), so
// the seeded stream and every balance number in CLAUDE.md are untouched by
// adding `hunt` above. ANTAGONIST_TYPE_KEYS (all six) is for lookups that
// need every defined type, never for the random draw itself.
const ANTAGONIST_TYPE_KEYS_BASE = ["lich","tyrant","dragon","plague","god"];
const ANTAGONIST_TYPE_KEYS = Object.keys(ANTAGONIST_TYPES);

function rollAntagonistName(type){
  const t = ANTAGONIST_TYPES[type];
  const f = t.firsts ? pick(t.firsts) : null;
  const e = pick(t.epithets);
  return t.nameFmt(f, e);
}
function rollThread(meta){
  const keys = (meta && meta.unlocks && meta.unlocks.antagonistHunt)
    ? ANTAGONIST_TYPE_KEYS : ANTAGONIST_TYPE_KEYS_BASE;
  const type = pick(keys);
  const t = ANTAGONIST_TYPES[type];
  return {antagonist: rollAntagonistName(type), antagonistType: type,
          goal: pick(t.goals), doom: pick(t.dooms)};
}

// stat pick (nothing asked who the hero IS), and ~89% of heroes never meet
// the antagonist because only ~11% reach the level-50 confrontation. This
// section is both fixes: narrative dilemma gates (prose choices that set a
// flag on S.world.flags), and antagonist encounters that put the villain on

// Levels chosen to collide with NO existing gate (class 10/25, skill
// 5/15/20/30/35/40/45/50) — MINOR_BEAT_LEVELS already owns 17/27/38 too, so
// those levels fire a minor "sign" beat immediately followed by the blocking
// dilemma. That reads fine (a small omen, then the actual choice) and wasn't
// worth reshuffling an existing, tuned cadence to avoid.
const DILEMMA_LEVELS = [7, 17, 27, 38, 47];
const DILEMMA_LEVEL_KEY = {7:"village", 17:"rival", 27:"shortcut", 38:"wastes", 47:"edge"};

// a herald, the aftermath of something — thread-typed like ACT_MAJOR, at
// levels that don't collide with MINOR_BEAT_LEVELS (12/14/17 and 21/24/27)
// either, so this reads as its own distinct beat rather than a duplicate sign.

// Act IV's costly failed encounter fires once, guarded by
// S.world.act4FailureDone. Level 32 sits clear of every existing gate
// (class/skill/dilemma) and MINOR_BEAT_LEVELS' 31/33/36.

/* ------------------------------ shared helpers ----------------------------- */

// A peril-shaped HP delta (same percentage-of-a-level-typical-pool math as
// rollPeril/refHP) that can never itself cause DEAD — a dilemma or a scripted
// story beat shouldn't end the chronicle on a screen the player didn't see
// coming as danger. Floors at 1 HP and fires the same near-death crossing log
// line rollPeril() does, so a dilemma that hurts reads exactly like a peril
// that hurts everywhere else in the chronicle.
// nearDeathVeteran bookkeeping, shared by both near-death crossing call
// sites (rollPeril() and applyHpFrac()) so the counter and the achievement
// check live in exactly one place. Guarded on S._meta first, same discipline
// as unlockAchievement() itself, so simulate(n) (meta always null) never
// touches this.
function noteNearDeathCrossing(S){
  if (!S._meta) return;
  S._meta.nearDeathCrossings = (S._meta.nearDeathCrossings || 0) + 1;
  saveMeta();
  if (S._meta.nearDeathCrossings >= 15) unlockAchievement(S._meta, "nearDeathVeteran", S);
}
// The near-death crossing (HP falls under 20% having been above it a moment
// ago) is a back-half-of-the-run staple — fires often once perils start
// hitting harder in zones 4-6. hashPick() on name+HP+level, not pick() — both
// call sites below (applyHpFrac and rollPeril) sit inside the simulation core
// and neither has ever spent an rng() draw here.
const NEARDEATH_LINES = [
  "{name} is barely standing. HP critical.",
  "{name}'s legs nearly go out from under them. Not much left to spend.",
  "{name} is running on fumes now, and the road doesn't care.",
  "Whatever {name} has left, it isn't much. HP critical.",
  "{name} is a bad step away from not getting back up.",
  "The margin around {name} has gone very thin. HP critical.",
  "{name} is still moving, technically. Everything past that is borrowed.",
  "There isn't much of {name} left to spend right now, and the road knows it.",
];
function nearDeathLine(S){
  const h = S.hero;
  const tmpl = hashPick(NEARDEATH_LINES, h.name + "#nd#" + Math.round(h.hp) + "#" + h.level);
  return fillTemplate(tmpl, {name: h.name});
}
function applyHpFrac(S, frac){
  const h = S.hero, d = derived(h, S.gear);
  const wasSafe = h.hp / d.maxHP >= 0.20;
  const delta = Math.round(d.maxHP * frac);
  h.hp = Math.max(1, Math.min(d.maxHP, h.hp + delta));
  if (wasSafe && h.hp / d.maxHP < 0.20){
    logEvent(S, "neardeath", nearDeathLine(S), 1);
    noteNearDeathCrossing(S);
  }
  return delta;
}
// A lingering scar (or, sometimes, a callus) — a small PERMANENT shift to a
// base stat, same category of write as allocateStats()/race mods, not a
// derived()-layer effect. Floored at 1 so a bad roll can't zero a stat out.
function applyStatScar(S, stat, amount){
  S.hero.stats[stat] = Math.max(1, S.hero.stats[stat] + amount);
}
// A temporary boon that decays by TASKS COMPLETED, not clock time, so it
// means the same thing whether the hero is played live or caught up offline
// in one burst. Folded into effStats()/derived() via boonAgg() below, same
// effect-kind vocabulary SKILLS already uses. Decremented in decayBoons(),
// called once per completed task (see completeTask()).
function grantBoon(S, key, tasks, effect){
  S.hero.boons = S.hero.boons || [];
  S.hero.boons.push({key, tasksLeft: tasks, effect});
}
function decayBoons(S){
  const h = S.hero;
  if (!h.boons || !h.boons.length) return;
  h.boons = h.boons.filter(b => --b.tasksLeft > 0);
}
// Aggregates hero.boons the same way skillAgg() aggregates hero.skills.
// Kept as a separate small object (rather than folded into skillAgg itself)
// because boons are transient game-state, not permanent character build —
// keeping the two aggregations separate means a boon can never accidentally
// leak into anything that reads hero.skills directly.
function boonAgg(hero){
  const agg = {stat:{}, xpMult:1, goldMult:1, taskSpeedMult:1, mitigation:0, evasion:0};
  for (const k of STAT_KEYS) agg.stat[k] = 0;
  for (const b of (hero.boons || [])){
    const e = b.effect;
    if (!e) continue;
    switch (e.kind){
      case "stat": agg.stat[e.stat] += e.amount; break;
      case "mult":
        if (e.target === "xp") agg.xpMult += e.amount;
        else if (e.target === "gold") agg.goldMult += e.amount;
        break;
      case "mitigation": agg.mitigation += e.amount; break;
      case "evasion": agg.evasion += e.amount; break;
      case "taskSpeed": agg.taskSpeedMult -= e.amount; break;
    }
  }
  agg.taskSpeedMult = Math.max(BALANCE.skillTaskSpeedFloor, agg.taskSpeedMult);
  return agg;
}

function beginDilemma(S, key){
  const dil = DILEMMAS[key];
  const variantIdx = randInt(0, dil.variants.length - 1);
  S.world.pendingChoice = {kind:"dilemma", dilemmaKey:key, variantIdx,
                            options: Object.keys(dil.options)};
  S.world.state = "AWAITING_CHOICE";
  logEvent(S, "dilemma", fillTemplate(dil.variants[variantIdx], threadVars(S)), 2);
}

// References a dilemma flag if one is available, so the encounter (and by
// extension the run) reads as continuous with choices made earlier — the
// entire point of threading flags through S.world in the first place.
function act4FlagLine(S){
  const f = S.world.flags || {};
  const h = S.hero;
  if (f.rival === "carried")
    return ` The message ${h.name} has been carrying doesn't survive the encounter — whatever it said, it's ash now, same as everything else here.`;
  if (f.shortcut === "took")
    return ` Something about the encounter feels familiar in a way ${h.name} can't place — the same shape as a name once traded away in the dark, maybe, if there were still a name left to compare it to.`;
  if (f.village === "helped")
    return ` ${h.name} thinks, in the middle of it, of a village that's rebuilding a little because someone once stopped to help. It isn't much of a shield. It's something.`;
  return "";
}

function triggerAct4Failure(S){
  const h = S.hero, w = S.world;
  w.act4FailureDone = true;
  const type = w.thread.antagonistType;
  const base = fillTemplate(pick(ACT4_FAILURE[type]), threadVars(S));

  // Cost 1: always a heavy, survivable HP toll (never lethal — see applyHpFrac).
  applyHpFrac(S, -(0.45 + rng() * 0.20));

  // Cost 2: the harshest thing actually available, in priority order — a
  // charge held in reserve, then equipped gear, then (only if truly nothing
  // else is left) a flag's payoff taken back.
  let costLine;
  if (h.skillCheatDeathQueue && h.skillCheatDeathQueue.length){
    h.skillCheatDeathQueue.pop();
    costLine = ` Whatever was holding a line open for ${h.name} in reserve is gone now — spent just staying alive.`;
  } else if (h.cheatDeathCharges > 0){
    h.cheatDeathCharges--;
    costLine = ` A ward ${h.name} was carrying breaks keeping this from being the last page of the chronicle.`;
  } else {
    const equippedSlots = SLOT_KEYS.filter(s => S.gear[s]);
    if (equippedSlots.length){
      const slot = pick(equippedSlots);
      const lost = S.gear[slot];
      S.gear[slot] = null;
      // cap() because costLine is appended after a sentence-ending period and
      // itemPhrase() returns a lowercase article ("a Silvered Maul ...").
      costLine = ` ${cap(itemPhrase(lost))} doesn't survive it — ${h.name} does, barely, and without it.`;
    } else if (S.world.flags.rival === "carried"){
      S.world.flags.rival = "lost";
      costLine = ` Whatever ${h.name} was carrying for someone else doesn't make it through — lost, the same as everything else here.`;
    } else {
      costLine = ` ${h.name} has nothing left to lose but time, and loses some of that too.`;
    }
  }

  logEvent(S, "antagonist", `${base}${costLine}${act4FlagLine(S)}`, 2);
}

// Extra sentence appended to the death/ascension epilogue when a dilemma flag
// is available to pay off — the concrete demonstration that a choice made
// hours (or acts) earlier still means something at the very end. Priority
// order favors the most recently-set, most story-relevant flag.
function flagEpitaph(S, outcome){
  const f = S.world.flags || {};
  const h = S.hero;
  if (f.edge === "accepted")
    return outcome === "ascension"
      ? ` Whatever ${h.name} took on that last stretch of road went into this. It isn't easy to look at directly, even now.`
      : ` Whatever ${h.name} took on that last stretch of road didn't turn out to be enough, in the end. It rarely is.`;
  if (f.edge === "refused")
    return outcome === "ascension"
      ? ` ${h.name} did this with nothing but what was already earned. That much, at least, is worth saying plainly.`
      : ` ${h.name} refused the easy edge, at the end, and paid the harder price instead. That was always going to be true either way.`;
  if (f.wastes === "helped")
    return ` Somewhere behind ${h.name}, in the Ashen Wastes, someone is still walking because ${h.name} stopped once. That doesn't end the story. It's still true.`;
  if (f.village === "helped")
    return ` A village ${h.name} once stopped to help is still standing, mostly — more than it would have said for itself the day ${h.name} found it.`;
  // The remaining flags never paid off outside their own dilemma scene until
  // now — a choice that never comes back is decorative, not a payoff.
  if (f.shortcut === "took")
    return ` Something ${h.name} traded away in the Barrows' dark never did come back — a name misplaced, and never quite recovered. It goes unnoticed most days. Today isn't most days.`;
  if (f.shortcut === "declined")
    return ` The long way through the Barrows cost hours ${h.name} never got back, and nothing else. There are worse trades to have made.`;
  if (f.rival === "carried")
    return ` Somewhere, someone finally hears the message a dying stranger once asked ${h.name} to carry. It took the whole rest of the road getting there. It got there.`;
  if (f.rival === "robbed")
    return ` ${h.name} still has the boots taken off a stranger who didn't need them anymore. They never did fit quite right. ${h.name} wore them anyway.`;
  if (f.rival === "lost")
    return ` Whatever ${h.name} was once carrying for a dying stranger never reached anyone. It didn't survive Act IV. Neither, in the end, did the promise.`;
  if (f.village === "passed")
    return ` A village ${h.name} once walked past without stopping is still out there somewhere, rebuilt or not. ${h.name} never went back to find out which.`;
  if (f.village === "mercenary")
    return ` The gold ${h.name} once took for a hard day's labor in a ruined village spent like any other gold. What it cost to take it that way didn't.`;
  if (f.wastes === "robbed")
    return ` A canteen taken off a stranger in the Wastes outlasted whatever it was traded for. ${h.name} still isn't sure it was a fair trade.`;
  if (f.wastes === "left")
    return ` ${h.name} still thinks, sometimes, about a shape in the ash that got smaller, and then gone. The Wastes take a great many people nobody stops for.`;
  return "";
}

// Same idea as act4FlagLine/flagEpitaph, but at a third beat — the moment the
// confrontation actually begins — so a flag set hours (or acts) earlier isn't
// only ever felt at the two places that already read it back. Pure string
// concatenation, no rng()/pick() of its own, called once at its one call site
// (beginConfrontation).
function confrontationFlagLine(S){
  const f = S.world.flags || {};
  const h = S.hero;
  if (f.edge === "accepted")
    return ` Whatever ${h.name} took on that stretch of road a long time ago is still there, right under the surface, exactly when it's needed most.`;
  if (f.shortcut === "declined")
    return ` The ward earned for refusing an easy way through the Barrows is still holding, acts later than ${h.name} probably expected it to. ${h.name} can feel it, faintly, standing here.`;
  if (f.village === "mercenary")
    return ` ${h.name} thinks, of all things, of coin taken from grieving hands a long time ago. It bought passage. It's still being paid for.`;
  if (f.rival === "robbed")
    return ` Someone else's boots have carried ${h.name} this whole way. It surfaces now, of all moments, and ${h.name} doesn't have time to ask why.`;
  return "";
}

// Swappable so the harness can run seeded and reproducible.
let rng = Math.random;
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const pick = arr => arr[Math.floor(rng() * arr.length)];
const randInt = (lo, hi) => lo + Math.floor(rng() * (hi - lo + 1));
function shuffle(arr){
  for (let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(rng() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
// A DETERMINISTIC alternative to pick() — same job (choose one of several
// variant strings) but keyed off a string already sitting in state (the
// hero's name, typically) instead of rng(). Used exactly where CLAUDE.md's
// "watch the rng draw count" rule would otherwise bite: arrival lines fire at
// a spot in the simulation core (arriveInZone) that historically consumed
// ZERO rng() draws, so giving it real variants via pick() would insert a new
// draw into the middle of the seeded stream and silently shift every balance
// number downstream of it. Hashing the hero's name instead costs nothing and
// still reads as "different every run," since the name itself was rolled.
// Not a substitute for pick() anywhere that already spends a draw — see the
// comment at arriveInZone() for the one call site this exists for.
function hashPick(arr, seedStr){
  let h = 2166136261;
  for (let i = 0; i < seedStr.length; i++){
    h ^= seedStr.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return arr[Math.abs(h) % arr.length];
}

// Populated by unlockAchievement(), drained the next time a render surfaces
// it (renderMain/renderCreation). Purely a UI convenience, never persisted.
let justUnlocked = [];

function unlockAchievement(meta, key, S){
  if (!meta) return;                      // no real player context — simulate(n), always
  meta.achievements = meta.achievements || [];
  if (meta.achievements.includes(key)) return;
  const a = ACHIEVEMENTS[key];
  if (!a) return;
  meta.achievements.push(key);
  meta.unlocks = meta.unlocks || {};
  a.apply(meta);
  justUnlocked.push(key);
  if (S) logEvent(S, "achievement", `Achievement unlocked — ${a.name}. ${a.reward}`, 2);
  saveMeta();
}

// Attaches a live meta reference to a hero state, non-enumerably so
// JSON.stringify(S) (saveGame) never serializes it into goquest_hero — the
// two saves stay deliberately separate (CLAUDE.md "Save"). Re-attached on
// every load, since JSON.parse can't round-trip a property descriptor.
function attachMeta(s, meta){
  Object.defineProperty(s, "_meta", {value: meta || null, writable: true, configurable: true, enumerable: false});
  return s;
}

// Called when a hero's run ends by any route — death, ascension, retirement —
// so the lifetime task tally survives the per-hero stats.tasksCompleted reset.
// Routing every ending through one function keeps the bookkeeping in one place.
function onHeroRunEnd(S){
  const meta = S._meta;
  if (!meta) return;
  meta.lifetimeTasks = (meta.lifetimeTasks || 0) + (S.stats.tasksCompleted || 0);
  // Persist here rather than trusting a later screen handler to flush it: the
  // "Lay Them to Rest" / ascend / retire handlers each call saveMeta(), but a
  // player who reloads on the epilogue screen without clicking through would
  // otherwise lose the whole run's tally. Same root cause as the classesReached
  // bug — a META mutation in the core must save itself.
  saveMeta();
  if (meta.lifetimeTasks >= 25000) unlockAchievement(meta, "longRecord", S);
}
// Kept under the old name so the existing death call sites don't have to move.
function onHeroDeath(S){ onHeroRunEnd(S); }

// Full-rare-set bookkeeping, called at the end of equipItem() so every path
// that can complete the set (task drop, merchant buy, starting relic) is covered.
function checkFullRareSet(S){
  const meta = S._meta;
  if (!meta) return;
  for (const slot of SLOT_KEYS){
    const it = S.gear[slot];
    if (!it || (it.tier !== "rare" && it.tier !== "epic" && it.tier !== "legendary")) return;
  }
  unlockAchievement(meta, "fullRareSet", S);
}

  if (u.wayfarerNames) pool.push(...NAME_WAYFARER);
  if (u.bloodmarkedNames) pool.push(...NAME_BLOODMARKED);

/* ------------------------------ state factory ---------------------------- */

// Permanent base-stat bumps granted by lifetime achievements — same layer as
// race mods (RACES[x].mods), a direct addition to the hero's BASE stats,
// computed once at creation. Every flag here is read from meta.unlocks,
// which is only ever truthy for a real player (simulate(n) always passes
// meta=null to createState), so the harness's statline is untouched. Kept
// modest and each on ITS OWN achievement (never stacked two bonuses onto one
// unlock) per Rob's 2026-08-07 note: spread across levers, don't collapse
// class identities into one optimal build.
function achievementStatMods(meta){
  const m = {};
  const u = (meta && meta.unlocks) || {};
  if (u.dilemmaWisdom) m.wis = (m.wis || 0) + 2;                              // allDilemmas
  if (u.veteranToughness) m.con = (m.con || 0) + 2;                          // fiftyHeroesRun
  if (u.threefoldBoon) for (const k of STAT_KEYS) m[k] = (m[k] || 0) + 1;    // ascendAllLineages
  return m;
}

// actV achievement reward (meta.unlocks.legacyCallback) — new heroes' opening
// chronicle nods to whoever most recently left the road, tying a fresh hero
// to the player's own Hall of Legends rather than starting in a vacuum.
// Reads meta.hall (never mutates it), so it's safe to call even when hall is
// empty (a player could unlock this and then never see it fire until their
// NEXT hero dies/ascends/retires — that's fine, there's nothing to call back to yet).
function legacyCallbackLine(meta){
  if (!meta || !meta.unlocks || !meta.unlocks.legacyCallback) return null;
  if (!meta.hall || !meta.hall.length) return null;
  const prev = meta.hall[meta.hall.length - 1];
  const article = aOrAn(RACES[prev.race] ? RACES[prev.race].name : prev.race);
  const raceName = RACES[prev.race] ? RACES[prev.race].name : prev.race;
  const phrase = prev.status === "Legend" ? "who finished the whole story"
    : prev.status === "Retired" ? "who stepped off the road while they still could"
    : "who didn't come back";
  // Raw text, NOT esc()'d here — entryHtml() escapes every log entry's text
  // at render time (see esc(e.text) there), same as every other logEvent()
  // call in this file. Pre-escaping here would double-escape (e.g. an
  // apostrophe in a rolled name would render as "&amp;#39;").
  return `The road remembers ${prev.name}, ${article} ${raceName} ${phrase} — before this one even takes the first step.`;
}

function createState(name, raceKey, meta){
  const race = RACES[raceKey];
  const achMods = achievementStatMods(meta);
  const stats = {};
  for (const k of STAT_KEYS) stats[k] = 8 + (race.mods[k] || 0) + (achMods[k] || 0);
  const statFrac = {}; for (const k of STAT_KEYS) statFrac[k] = 0;

  const S = {
    version: SAVE_VERSION,
    hero: {
      name, race: raceKey, cls: "novice", classPath: ["novice"],
      level: 1, xp: 0, hp: 0, stats, statFrac,
      gold: (meta && meta.unlocks && meta.unlocks.startGold) || 0,
      skills: [],
      // graveSense (tenHeroesRest) also grants +1 starting cheat-death
      // charge — a strictly-positive, "genuinely good" reward (an extra
      // life, never structurally worse the way the old +1 inventory slot
      // was — see CLAUDE.md "A Long List of Names") — on top of the
      // grave-knowledge flavor below.
      cheatDeathCharges: (race.bonusCheatDeath || 0)
        + ((meta && meta.unlocks && meta.unlocks.graveSense) ? 1 : 0),
      skillCheatDeathQueue: [], skillState: {},
      boons: [],   // dilemma-granted temporary effects — see grantBoon()/boonAgg()
      // Persistent world (2026-08-03 brief) — ids of graves already found
      // THIS run, so the same grave can't fire twice and so a hero never
      // finds their own (see eligibleGraves()). Per-hero, so it resets on
      // every new hero even though the graves themselves live in meta.
      foundGraveIds: [],
      // Phase 7 — meta-progression unlocks baked in ONCE at creation (not
      // read continuously from META during play, which isn't threaded
      // through the simulation core). See ACHIEVEMENTS' apply() functions.
      metaDropBonus: (meta && meta.unlocks && meta.unlocks.dropBonus) || 0,
      metaInvBonus: (meta && meta.unlocks && meta.unlocks.invSlotBonus) || 0,
      // New lifetime-achievement perks (2026-08-07), same baked-at-creation
      // pattern as the two above — folded into derived() (see below), never
      // read directly by anything downstream.
      metaDropTierBump: (meta && meta.unlocks && meta.unlocks.gravenDropBump) || 0,   // heirloomRecoverer
      metaEvasionBonus: (meta && meta.unlocks && meta.unlocks.scarredEvasion) || 0,   // nearDeathVeteran
      metaBuyDiscount: (meta && meta.unlocks && meta.unlocks.merchantDiscount) || 0,  // commissioner
      metaXpBonus: (meta && meta.unlocks && meta.unlocks.speedXpBonus) || 0,          // speedFifty
    },
    world: {
      zone: 1, state: "QUESTING", taskProgressMs: 0, taskName: "",
      travelMsLeft: 0, travelKind: null,   // 'zone' | 'merchant_out' | 'merchant_return'
      act: 1, thread: null,
      pendingChoice: null,   // {kind:'class', options:[...]}
      bankedMs: 0,           // unspent offline time held across a blocking choice
      clock: Date.now(),     // SIMULATED time — what the chronicle is stamped with
      killedBy: null,        // peril incident text that ended the run, for the death screen
      epilogueIdx: null,     // which EPILOGUES template, chosen once at death so it's stable on reload
      // Phase 6 — story/ascension.
      confrontation: null,        // {step} while state === "CONFRONTATION"
      diedInConfrontation: false, // distinguishes a confrontation death from an ordinary zone6 death
      ascendedAt: null,           // simulated clock time of ascension, for the epilogue's "time lived"
      ascensionEpilogueIdx: null, // which ASCENSION_EPILOGUES template, stable on reload
      // Narrative dilemma gates (2026-08-03 brief) — see DILEMMAS.
      flags: {},              // set by dilemma choices, read back by later story beats/epilogues
      act4FailureDone: false, // guards the Act IV costly-failure beat to fire exactly once
    },
    gear: {weapon:null, armor:null, helm:null, gloves:null, boots:null, relic:null},
    inventory: [],
    log: [],
    // birthTime is stamped from the SIMULATED clock, because deathTime is too.
    // Subtracting a simulated timestamp from a wall-clock one produced a
    // negative lifespan on the death screen.
    stats: {tasksCompleted:0, birthTime:null, deathTime:null,
            goldEarned:0, itemsFound:0, perilsSurvived:0, merchantTrips:0},
    lastTick: Date.now(),
  };
  attachMeta(S, meta || null);
  // Ascend-once reward: a starting relic, equipped BEFORE hp is computed so
  // its stat bonuses (esp. CON) count toward the hero's opening maxHP. Only
  // runs when a real meta grants it — never during simulate(n) (meta null).
  if (meta && meta.unlocks && meta.unlocks.startRelic){
    const relic = generateItem(1, "relic", false, 0, meta.unlocks.startRelic);
    equipItem(S, relic);
  }
  S.stats.birthTime = S.world.clock;
  S.hero.hp = derived(S.hero, S.gear).maxHP;
  S.world.taskName = pick(TASKS[1]);
  // Roll the per-run story thread (design doc §12) and open the chronicle.
  // Done here, inside the pure state factory, so simulate(n) gets the exact
  // same opening beat a real playthrough would — not something bolted on in
  // the render layer.
  S.world.thread = rollThread(meta);
  logEvent(S, "birth", `${S.hero.name} takes up the road.`, 2);
  if (S.gear.relic) logEvent(S, "gear", `${S.hero.name} sets out already carrying ${itemPhrase(S.gear.relic)}.`, 1);
  // actV reward (legacyCallback) — a one-line nod to the last hero who left
  // the road, before the act-1 story beat below. legacyCallbackLine() only
  // returns non-null for a real player with the unlock AND a non-empty Hall.
  const callback = legacyCallbackLine(meta);
  if (callback) logEvent(S, "story", callback, 1);
  logEvent(S, "story", fillTemplate(pick(ACT_MAJOR[1][S.world.thread.antagonistType]), threadVars(S)), 2);
  // tenHeroesRest reward (graveSense) — guaranteed early grave discovery.
  // Placed after the opening story beat so the log reads: birth, [legacy nod],
  // Act I beat, THEN the grave-knowledge line — chronicle order, not creation order.
  applyGraveSenseAtCreation(S);
  return S;
}

/* -------------------------- derived stats (one place) -------------------- */
// Gear (and, later, skill) bonuses are folded in HERE so every consumer
// inherits them automatically. Nothing downstream should read hero.stats
// directly — always go through derived()/effStats().

// Aggregates every non-event skill effect a hero currently owns (signature
// passives included — they're stored in hero.skills exactly like picks) into
// one small object. "triggered" and "cheatdeath" are event-driven, not
// aggregated stats, so they're handled at the point they fire instead (see
// checkTriggers() and the cheat-death branch in rollPeril()).
function skillAgg(hero){
  const agg = {stat:{}, xpMult:1, goldMult:1, taskSpeedMult:1, mitigation:0,
               evasion:0, sellMult:1, buyMult:1, dropTierBump:0};
  for (const k of STAT_KEYS) agg.stat[k] = 0;
  for (const key of hero.skills){
    const sk = SKILLS[key];
    if (!sk) continue;
    const e = sk.effect;
    switch (e.kind){
      case "stat": agg.stat[e.stat] += e.amount; break;
      case "mult":
        if (e.target === "xp") agg.xpMult += e.amount;
        else if (e.target === "gold") agg.goldMult += e.amount;
        break;
      case "taskSpeed": agg.taskSpeedMult -= e.amount; break;
      case "mitigation": agg.mitigation += e.amount; break;
      // Evasion is the DEX classes' answer to soak. It stacks on TOP of the
      // DEX-derived evasion cap deliberately — capping it again would recreate
      // exactly the dead-stat problem that made Assassin unplayable.
      case "evasion": agg.evasion += e.amount; break;
      case "economy":
        if (e.target === "sell") agg.sellMult += e.amount;
        else if (e.target === "buy") agg.buyMult -= e.amount;
        break;
      case "dropQuality": agg.dropTierBump += e.amount; break;
    }
  }
  // Safety clamps (BALANCE-tunable): a handful of skill gates should never
  // let one system fully trivialize itself no matter how many stack onto
  // the same lever.
  agg.taskSpeedMult = Math.max(BALANCE.skillTaskSpeedFloor, agg.taskSpeedMult);
  agg.mitigation = Math.min(BALANCE.skillMitigationCap, agg.mitigation);
  agg.buyMult = Math.max(BALANCE.skillBuyMultFloor, agg.buyMult);
  return agg;
}

function effStats(hero, gear){
  const out = {};
  for (const k of STAT_KEYS) out[k] = hero.stats[k];
  if (gear) for (const slot of SLOT_KEYS){
    const item = gear[slot];
    if (item) for (const k in item.stats) out[k] += item.stats[k];
  }
  const agg = skillAgg(hero);
  for (const k of STAT_KEYS) out[k] += agg.stat[k];
  const bagg = boonAgg(hero);
  for (const k of STAT_KEYS) out[k] += bagg.stat[k];
  return out;
}

function derived(hero, gear){
  const st = effStats(hero, gear);
  const race = RACES[hero.race];
  const agg = skillAgg(hero);
  const bagg = boonAgg(hero);   // dilemma-granted temporary effects — see grantBoon()
  const maxHP = 50 + st.con * 8 + hero.level * 10;
  return {
    stats: st,
    maxHP,
    taskMs: TASK_DURATION * 1000
            * Math.max(0.65, 1 - st.str * 0.004)
            * (race.taskSpeedMult || 1)
            * agg.taskSpeedMult * bagg.taskSpeedMult,
    // metaXpBonus (speedFifty) stacks as its own multiplicative factor, same
    // shape as race.xpMult, so it composes cleanly with everything else here.
    xpMult:   (1 + st.int * 0.012) * (race.xpMult || 1) * agg.xpMult * bagg.xpMult * (1 + (hero.metaXpBonus || 0)),
    goldMult: (1 + st.cha * 0.010) * agg.goldMult * bagg.goldMult,
    // metaEvasionBonus (nearDeathVeteran) stacks on top of the DEX-derived
    // cap, same as race.evasionBonus and skill/boon evasion already do —
    // see the comment on skillAgg() for why that stacking is deliberate.
    evasion:  Math.min(BALANCE.evasionCap, st.dex * 0.008)
              + (race.evasionBonus || 0) + agg.evasion + bagg.evasion + (hero.metaEvasionBonus || 0),
    perilMult: Math.max(0.70, 1 - st.wis * 0.006),
    regenPerTask: maxHP * BALANCE.regenBase
                  * (1 + Math.min(st.con, BALANCE.regenConCap) / BALANCE.regenConDiv)
                  * (race.regenMult || 1),
    dropChance: 0.12 + (race.dropBonus || 0) + (hero.metaDropBonus || 0),
    mitigation: Math.min(BALANCE.skillMitigationCap, agg.mitigation + bagg.mitigation),
    sellMult: agg.sellMult,
    // metaBuyDiscount (commissioner) reuses the same floor as skillBuyMultFloor
    // so a stacked economy build still can't push prices to zero.
    buyMult: Math.max(BALANCE.skillBuyMultFloor, agg.buyMult - (hero.metaBuyDiscount || 0)),
    // metaDropTierBump (heirloomRecoverer) is the same "amount" scale as the
    // dropQuality skill effect (treasure_sense is 1, loremans_eye is 0.6).
    dropTierBump: agg.dropTierBump + (hero.metaDropTierBump || 0),
  };
}

/* --------------------------------- log ----------------------------------- */
// importance: 0 routine (pruned) · 1 notable (kept) · 2 story beat (kept, framed)

function logEvent(S, type, text, imp, extra){
  // Stamped with the SIMULATED clock, not the wall clock. Eight hours of
  // offline catch-up must read as eight hours in the chronicle, not as one
  // minute at boot time. `extra` is an optional bag of additional fields
  // (currently only `zone`, from arriveInZone()) merged onto the record —
  // purely additive, so every existing call site is unaffected.
  const e = {t: S.world.clock || Date.now(), type, text, imp: imp || 0};
  if (extra) Object.assign(e, extra);
  S.log.push(e);
  if (S.log.length > LOG_ROUTINE_MAX + 400) pruneLog(S);
}
function pruneLog(S){
  const kept = [];
  let routine = 0;
  for (let i = S.log.length - 1; i >= 0; i--){
    const e = S.log[i];
    if (e.imp > 0) { kept.push(e); continue; }
    if (routine < LOG_ROUTINE_MAX) { kept.push(e); routine++; }
  }
  kept.reverse();
  S.log = kept;
}

/* ============================ SIMULATION CORE ============================= */
/* No DOM. No Date.now() for pacing. Pure with respect to (state, rng).       */

function allocateStats(S){
  // +3 points per level, distributed by class weighting. Fractional carry
  // keeps the long-run split exact and stays deterministic (no rng), so two
  // heroes of the same class and level always have the same statline.
  const h = S.hero;
  const w = CLASSES[h.cls].weights;
  const total = STAT_KEYS.reduce((a,k) => a + w[k], 0);
  for (const k of STAT_KEYS) h.statFrac[k] += 3 * w[k] / total;
  for (const k of STAT_KEYS){
    const whole = Math.floor(h.statFrac[k]);
    if (whole > 0){ h.stats[k] += whole; h.statFrac[k] -= whole; }
  }
}

// Level-up fires ~49 times a run and used to be one flat template the whole
// way through — "reaches level N" reads the same at level 3 as at level 47,
// which is wrong: a level-up in Act I (still finding their feet) shouldn't
// read like one in Act V (closing in on the Crown). Keyed by act, selected
// via hashPick() (name+level as seed — never an rng() draw) rather than
// pick(), same discipline as the gear-drop and arrival banks.
const LEVEL_UP_LINES = {
  1: [
    "{name} reaches level {level} — still finding their feet on this road, but finding them.",
    "Level {level}. {name} is not who left the Hollow anymore, not quite.",
    "{name} reaches level {level}, one small callus at a time.",
    "Level {level} comes without ceremony. {name} barely notices the road doing its work.",
    "{name} reaches level {level} — the early lessons, the ones that stick.",
  ],
  2: [
    "{name} reaches level {level}, the chosen path starting to show in how they move.",
    "Level {level}. Whatever {name} is becoming, it's getting harder to mistake for anyone else.",
    "{name} reaches level {level} — the Thornwood's lessons, learned the hard way and kept.",
    "Level {level} settles into {name} like something earned rather than given.",
    "{name} reaches level {level}, steadier now than the hero who first entered this dark.",
  ],
  3: [
    "{name} reaches level {level} — deeper in now than turning back would forgive.",
    "Level {level}. {name} has stopped flinching at things that would have stopped them cold a few levels back.",
    "{name} reaches level {level}, the road's cost and the road's reward climbing together.",
    "Level {level} arrives with the particular confidence of someone who has survived worse than this so far.",
    "{name} reaches level {level} — not far now from becoming whoever they're going to become.",
  ],
  4: [
    "{name} reaches level {level}, carrying more than levels alone can measure at this point.",
    "Level {level}. The road doesn't get easier from here, and {name} has stopped expecting it to.",
    "{name} reaches level {level} — every one of them earned harder than the last.",
    "Level {level} lands heavier than it used to. {name} notices, and keeps walking anyway.",
    "{name} reaches level {level}, closer to the reckoning than to anywhere safe.",
  ],
  5: [
    "{name} reaches level {level} — close enough now to the end that it has a shape.",
    "Level {level}. Whatever waits at the Crown, {name} is nearly ready to meet it.",
    "{name} reaches level {level}, each one now a step measured against what's coming.",
    "Level {level} arrives with the Crown already visible on the horizon. {name} doesn't look away from it.",
    "{name} reaches level {level} — this far along, turning back stopped being a real option a long time ago.",
  ],
};

function levelUp(S){
  const h = S.hero;
  const before = derived(h, S.gear).maxHP;
  h.level++;
  allocateStats(S);
  const after = derived(h, S.gear).maxHP;
  h.hp += Math.max(0, after - before);   // new max HP arrives as usable HP
  {
    const actN = actForLevel(h.level).n;
    const tmpl = hashPick(LEVEL_UP_LINES[actN], h.name + "#level#" + h.level);
    logEvent(S, "level", fillTemplate(tmpl, {name: h.name, level: h.level}), 1);
  }

  // Story beats (design doc §12) fire on LEVEL thresholds, not task counts,
  // and always — even on a level that also opens a blocking choice below.
  const newAct = actForLevel(h.level).n;
  if (newAct !== S.world.act){
    S.world.act = newAct;
    const variants = ACT_MAJOR[newAct][S.world.thread.antagonistType];
    logEvent(S, "story", fillTemplate(pick(variants), threadVars(S)), 2);
    if (S._meta){
      if (newAct === 2) unlockAchievement(S._meta, "actII", S);
      if (newAct === 3) unlockAchievement(S._meta, "actIII", S);
      if (newAct === 4) unlockAchievement(S._meta, "actIV", S);
      if (newAct === 5) unlockAchievement(S._meta, "actV", S);
    }
  }
  if (h.level === 40 && S._meta) unlockAchievement(S._meta, "level40", S);
  // Meteoric (speedFifty): level 50 reached in under 12 simulated hours, in
  // this one run. w.clock is the simulated clock (never Date.now() — see
  // CLAUDE.md "the one architectural rule"), so this reads correctly whether
  // the level-up happened live or inside an offline catch-up burst.
  if (h.level === 50 && S._meta && (S.world.clock - S.stats.birthTime) < 14 * 3600000)
    unlockAchievement(S._meta, "speedFifty", S);
  if (MINOR_BEAT_LEVELS[h.level]){
    // Bucket is the hero's ZONE, not their act — see the comment on
    // ZONE_MINOR above for why. zoneForLevel() is a pure function of the
    // level already reached, so this reads from a different literal object
    // than before but calls pick() exactly once, same as it always did.
    const zoneN = zoneForLevel(h.level).n;
    const sign = pick(ANTAGONIST_TYPES[S.world.thread.antagonistType].signs);
    const tmpl = pick(zoneMinorPool(S, zoneN));
    logEvent(S, "story", fillTemplate(tmpl, threadVars(S, {sign})), 2);
  }

  // Antagonist on-screen encounters (Acts II/III) — non-blocking, thread-typed.
  if (ANTAGONIST_ENCOUNTER_LEVEL_ACT[h.level]){
    const actN = ANTAGONIST_ENCOUNTER_LEVEL_ACT[h.level];
    const variants = ANTAGONIST_ENCOUNTER[actN][S.world.thread.antagonistType];
    logEvent(S, "antagonist", fillTemplate(pick(variants), threadVars(S)), 2);
  }

  // Act IV's costly failed encounter — fires once. See triggerAct4Failure().
  if (h.level === ACT4_FAILURE_LEVEL && !S.world.act4FailureDone) triggerAct4Failure(S);

  // Class advancement is a blocking choice: the sim stops here and waits.
  if (h.level === 10 && CLASSES[h.cls].tier === 0){
    S.world.pendingChoice = {kind:"class", options:["soldier","scout","apprentice"]};
    S.world.state = "AWAITING_CHOICE";
    logEvent(S, "choice", `${h.name} stands at a crossroads. A path must be chosen.`, 2);
    return;
  }
  // Tier-2 advancement at L25 forks each tier-1 class four ways (design doc §6).
  if (h.level === 25 && CLASSES[h.cls].tier === 1){
    S.world.pendingChoice = {kind:"class2", options: ADVANCED_OF[h.cls]};
    S.world.state = "AWAITING_CHOICE";
    logEvent(S, "choice", `${h.name} feels the shape of what they might become.`, 2);
    return;
  }
  // Skill picks at the design doc's eight milestone levels (§8) — same
  // blocking machinery, drawn from whatever class's pool the hero currently
  // belongs to (novice at L5, tier-1 at L15/20, tier-2 at L30-50).
  if (SKILL_LEVELS.includes(h.level)){
    const opts = rollSkillOptions(S);
    if (opts.length){
      S.world.pendingChoice = {kind:"skill", options: opts};
      S.world.state = "AWAITING_CHOICE";
      logEvent(S, "choice", `${h.name} has learned enough to refine their craft.`, 2);
      return;
    }
  }
  // Narrative dilemma gates — same blocking machinery as class/skill, but the
  // choice is prose, not a stat pick, and sets a flag on S.world.flags that
  // later beats (Act IV's failure, the epilogues) read back. See DILEMMAS.
  if (DILEMMA_LEVELS.includes(h.level)){
    beginDilemma(S, DILEMMA_LEVEL_KEY[h.level]);
    return;
  }

  // Zone changes are level-gated and automatic.
  const z = zoneForLevel(h.level);
  if (z.n !== S.world.zone) beginTravel(S, z.n);
}

// Which two (or fewer, if the pool is nearly exhausted) not-yet-owned skills
// to offer from the hero's current class pool. Pool sizes are chosen so this
// never comes up empty on a real progression path — see the comment above
// SKILLS.
function rollSkillOptions(S){
  const h = S.hero;
  const pool = (SKILL_POOLS[h.cls] || []).filter(k => !h.skills.includes(k));
  return shuffle(pool.slice()).slice(0, Math.min(2, pool.length));
}

// Pushes a skill onto the hero permanently. Cheat-death skills get queued
// separately (with their own flavor text) rather than folded into the
// generic race/gear cheatDeathCharges counter, so the log line that fires on
// consumption can still name the specific skill — see rollPeril().
function grantSkill(S, key){
  const h = S.hero;
  h.skills.push(key);
  const sk = SKILLS[key];
  if (sk && sk.effect.kind === "cheatdeath"){
    h.skillCheatDeathQueue = h.skillCheatDeathQueue || [];
    const n = sk.effect.amount || 1;
    for (let i = 0; i < n; i++) h.skillCheatDeathQueue.push(sk.effect.text);
  }
}

// Second Wind and its kin: called once per task after damage has resolved.
// Heals fire in hero.skills order; "once per merchant cycle" flags live in
// hero.skillState and are cleared in doMerchantTrip().
function checkTriggers(S){
  const h = S.hero;
  const d = derived(h, S.gear);
  const frac = h.hp / d.maxHP;
  for (const key of h.skills){
    const sk = SKILLS[key];
    if (!sk || sk.effect.kind !== "triggered") continue;
    const e = sk.effect;
    if (e.event !== "lowHp" || frac >= e.threshold) continue;
    h.skillState = h.skillState || {};
    if (e.once === "merchantCycle" && h.skillState[key]) continue;
    const amt = Math.round(d.maxHP * e.healFrac);
    h.hp = Math.min(d.maxHP, h.hp + amt);
    if (e.once === "merchantCycle") h.skillState[key] = true;
    logEvent(S, "trigger", e.text.replace("{name}", h.name).replace("{amt}", amt), 2);
  }
}

function beginTravel(S, zoneN){
  S.world.state = "TRAVELING";
  S.world.travelKind = "zone";
  S.world.travelMsLeft = TRAVEL_SECONDS * 1000;
  S.world.pendingZone = zoneN;
  logEvent(S, "travel", `${S.hero.name} sets out for ${ZONES[zoneN-1].name}.`, 1);
}
function arriveInZone(S){
  const n = S.world.pendingZone;
  S.world.zone = n;
  S.world.pendingZone = null;
  S.world.travelKind = null;
  S.world.state = "QUESTING";
  S.world.taskProgressMs = 0;
  S.world.taskName = pick(TASKS[n]);
  // hashPick, not pick() — this call site has never spent an rng() draw, and
  // this is a display-only choice among equally-valid flavor lines, so it
  // stays that way. See the comment on hashPick() and on ARRIVAL above.
  // Defensive on BOTH lookups. A save can reach here with world.thread null
  // (created before Phase 6 added threads, or hand-edited/imported) or with an
  // antagonistType that isn't a key in this table. Either one used to throw a
  // TypeError out of advance() — and because runCatchUp()'s step had no
  // try/catch, that killed the setTimeout chain and left the player stuck on
  // the "Catching Up" screen forever with catchupBusy stuck true. ARRIVAL_LEGACY
  // already existed for the chronicle's chapter matching; it is the right
  // fallback here too.
  const type = S.world.thread && S.world.thread.antagonistType;
  const variants = (type && ARRIVAL[n] && ARRIVAL[n][type]) || null;
  const text = variants && variants.length
    ? hashPick(variants, S.hero.name + "#" + n)
    : ARRIVAL_LEGACY[n];
  logEvent(S, "zone", fillTemplate(text, threadVars(S)), 2, {zone: n});
}

/* ------------------------------ gear & drops ------------------------------ */

function rollTier(bump){
  // `bump` is now a numeric strength (0 = no bump, 1 = the merchant's standard
  // "slight tier bonus" per design doc §9) rather than a boolean, so the
  // Treasure Sense/Loreman's Eye drop-quality skill effect can add a partial
  // bump on top of — or independent of — the merchant's.
  bump = bump || 0;
  const keys = Object.keys(TIERS);
  let weights = keys.map(k => TIERS[k].weight);
  if (bump){
    const shift = Math.min(0.9, 0.2 * bump);
    weights = weights.map((w,i) => i === 0 ? w * (1 - shift) : w * (1 + shift));
    const sum = weights.reduce((a,b) => a+b, 0);
    weights = weights.map(w => w / sum);
  }
  const r = rng();
  let acc = 0;
  for (let i = 0; i < keys.length; i++){
    acc += weights[i];
    if (r < acc) return keys[i];
  }
  return keys[keys.length-1];
}

function rollItemStats(slot, budget){
  // 1-3 stats: the slot's favored stat(s) first, topped up from the full
  // stat list if the slot doesn't have enough favored stats to fill the roll.
  const count = randInt(1, Math.min(3, budget));
  const pool = shuffle(SLOT_FAVORED[slot].slice());
  const chosen = pool.slice(0, count);
  while (chosen.length < count){
    const k = pick(STAT_KEYS);
    if (!chosen.includes(k)) chosen.push(k);
  }
  const base = Math.floor(budget / count);
  let remainder = budget - base * count;
  const stats = {};
  for (const k of chosen){
    stats[k] = base + (remainder > 0 ? 1 : 0);
    if (remainder > 0) remainder--;
  }
  return stats;
}

// Item 4 (thematic, not statistical — Rob's correction): a Sorcerer and a
// Knight roll on the exact same SLOT_FAVORED stat budget (see rollItemStats
// above, untouched), but the NAME they find should read as belonging to
// their class — staves and robes for the Apprentice line, swords and plate
// for the Soldier line, bows and leathers for the Scout line. Archetype is
// derived from the hero's current class; tier-1 classes already lean their
// own way (a Soldier finds martial gear before forking into Knight/etc. at
// L25), and Novice (no lineage yet) falls back to the original generic bank.
// Relics stay the wildcard slot (design doc §9) — no archetype split there.
const CLASS_ARCHETYPE = {
  soldier:"martial", knight:"martial", berserker:"martial", warden:"martial", dragoon:"martial",
  scout:"skirmisher", ranger:"skirmisher", assassin:"skirmisher", duelist:"skirmisher", beastmaster:"skirmisher",
  apprentice:"arcane", wizard:"arcane", sorcerer:"arcane", warlock:"arcane", alchemist:"arcane",
};
function archetypeForClass(clsKey){ return CLASS_ARCHETYPE[clsKey] || null; }

// Archetype base-name banks — same [prefix] [base] [suffix] structure as the
// generic bank (PREFIX_BY_TIER/SUFFIX_BY_TIER stay tier-based and untouched),
// just a different BASE vocabulary per slot. Relic is deliberately absent —
// it always falls back to the generic BASE_BY_SLOT.relic wildcard. Every
// base here keeps the same singular/plural convention BASE_BY_SLOT already
// uses (gloves/boots plural, matching itemPhrase()'s "a pair of" handling;
// every other slot singular, so aOrAn() keeps reading correctly).
const ARCHETYPE_BASE_BY_SLOT = {
  martial: {
    weapon: ["Broadsword","Longsword","Greataxe","Warhammer","Maul","Claymore","Battleaxe","Warpick"],
    armor:  ["Plate Cuirass","Breastplate","Plate Harness","Plate Hauberk","Steel Plackart","Banded Cuirass","Plate Byrnie","Iron Cuirass"],
    helm:   ["Great Helm","Barbute","Steel Warhelm","Plate Sallet","Visored Helm","Iron Casque","Crested Helm","Plate Coif"],
    gloves: ["Plate Gauntlets","Steel Gauntlets","Mailed Fists","Iron Vambraces","War Gauntlets","Plated Grips","Steel Bracers","Ironclad Fists"],
    boots:  ["Plate Greaves","Steel Sabatons","Iron Treads","War Greaves","Plated Boots","Ironshod Warboots","Steel Footguards","Mailed Greaves"],
  },
  skirmisher: {
    weapon: ["Recurve Bow","Hunting Bow","War Dagger","Rapier","Hatchet","Shortbow","Stiletto","Longbow"],
    armor:  ["Leather Jerkin","Studded Leather","Ranger's Jerkin","Hide Coat","Supple Jerkin","Layered Hide","Traveler's Coat","Scout's Hide"],
    helm:   ["Leather Hood","Cowl","Ranger's Hood","Traveler's Cap","Leather Coif","Woodland Hood","Feathered Cap","Scout's Hood"],
    gloves: ["Leather Grips","Fingerless Gloves","Bracers","Leather Bracers","Archer's Grips","Supple Gloves","Handwraps","Hunter's Gloves"],
    boots:  ["Light Treads","Leather Striders","Soft-Soled Boots","Traveler's Boots","Quickstep Boots","Leather Anklets","Woodland Treads","Scout's Boots"],
  },
  arcane: {
    weapon: ["Gnarled Staff","Oaken Staff","Crystal Wand","Carved Rod","Bone Athame","Runed Staff","Glass Wand","Twisted Staff"],
    armor:  ["Robe","Vestment","Silk Mantle","Cloth Wrap","Embroidered Robe","Woven Mantle","Ceremonial Vestment","Arcane Cloak"],
    helm:   ["Circlet","Cloth Hood","Woven Cap","Silk Cowl","Jeweled Circlet","Arcane Circlet","Scholar's Cap","Woven Cowl"],
    gloves: ["Silk Gloves","Cloth Wraps","Woven Gloves","Runed Gloves","Spellcaster's Gloves","Silk Grips","Enchanted Wraps","Cloth Handwraps"],
    boots:  ["Cloth Slippers","Silk Boots","Woven Sandals","Soft Boots","Enchanted Slippers","Traveler's Slippers","Cloth Treads","Woven Boots"],
  },
};

// archetype is null for relics and for Novice/no-lineage-yet heroes, which
// both fall back to BASE_BY_SLOT — same one pick() call either way, so this
// never changes how many rng() draws an item costs.
function genItemName(slot, tier, archetype){
  const bases = (archetype && ARCHETYPE_BASE_BY_SLOT[archetype] && ARCHETYPE_BASE_BY_SLOT[archetype][slot])
    || BASE_BY_SLOT[slot];
  return `${pick(PREFIX_BY_TIER[tier])} ${pick(bases)} of ${pick(SUFFIX_BY_TIER[tier])}`;
}

// Gloves and boots base names (Gauntlets, Sabatons, Vambraces, Wraps…) are
// inherently plural — they come in pairs — so "a/an" reads wrong no matter
// which base got picked ("an epic Thornbound Sabatons"). Rather than force
// every base name in BASE_BY_SLOT singular (losing the flavor of "a pair of
// Gauntlets"), phrase those two slots with "a pair of" instead of an article.
// Every other slot's bases (generic AND every archetype bank above) are kept
// genuinely singular by convention, so they keep aOrAn().
const PLURAL_SLOTS = new Set(["gloves","boots"]);
function itemPhrase(item){
  const tierWord = (item.tier === "epic" || item.tier === "legendary") ? item.tier + " " : "";
  if (PLURAL_SLOTS.has(item.slot)) return `a pair of ${tierWord}${item.name}`;
  // The article agrees with whatever actually follows it — "an epic Sallet",
  // not "a epic Sallet" — so it must be read off the tier word when present.
  return `${aOrAn(tierWord || item.name)} ${tierWord}${item.name}`;
}

// slot omitted → random (a task drop can land in any slot); passed explicitly
// for merchant stock, which targets the hero's weakest equipped slot.
// skillBump adds the hero's dropQuality skill effect on top of the merchant bump.
// forceTier (Phase 7) skips the roll entirely — used for the ascendOnce
// starting-relic reward, where the tier is a fixed unlock, not a drop.
// archetype (item 4) picks which BASE_BY_SLOT-shaped name bank to draw from —
// see archetypeForClass()/ARCHETYPE_BASE_BY_SLOT above. Purely cosmetic:
// stats still roll off SLOT_FAVORED via rollItemStats, untouched.
function generateItem(zoneN, slot, tierBump, skillBump, forceTier, archetype){
  const z = ZONES[zoneN-1];
  slot = slot || pick(SLOT_KEYS);
  const ilvl = randInt(z.ilvl[0], z.ilvl[1]);
  const tier = forceTier || rollTier((tierBump ? 1 : 0) + (skillBump || 0));
  const score = ilvl * TIERS[tier].mult;
  const budget = Math.max(1, Math.round(score * BALANCE.gearBudget));
  const item = {
    name: genItemName(slot, tier, slot === "relic" ? null : archetype), slot, tier, ilvl, score,
    stats: rollItemStats(slot, budget), cheatDeath: 0,
  };
  // Relics are the only slot that can grant a cheat-death charge — kept
  // uncommon so it still reads as a notable find rather than a routine roll.
  if (slot === "relic" && rng() < 0.15) item.cheatDeath = 1;
  return item;
}

function equipItem(S, item){
  const old = S.gear[item.slot];
  if (old && old.cheatDeath) S.hero.cheatDeathCharges = Math.max(0, S.hero.cheatDeathCharges - old.cheatDeath);
  S.gear[item.slot] = item;
  if (item.cheatDeath) S.hero.cheatDeathCharges += item.cheatDeath;
  checkFullRareSet(S);
  return old;
}

// Gear-drop phrasing (~200 fires per run, easily the most-read loot line in
// the game after task lines) used to be one fixed template each for "first
// piece in this slot" and "upgrade over what's equipped." Selected via
// hashPick(), NOT pick() — rollDrop() already spends exactly the rng() draws
// generateItem()/rollTier() need, and adding a real draw here for flavor
// alone would shift the seeded stream for no balance reason. Seeded on the
// item's own (already-rolled) name plus the hero's, so the same hero sees a
// different line every time without costing anything. {item}/{Item} are the
// lowercase- and capitalized-article itemPhrase(); {old} is the outgoing
// item's bare name (no article — see the templates using "the {old}").
const GEAR_FIRST_LINES = [
  "{name} finds {item} and arms themselves with it.",
  "{Item} turns up in the wreckage, and {name} isn't about to leave it behind.",
  "{name} comes away from the day's work with {item} — small mercy, but a real one.",
  "{Item} — {name} takes the find as a plain stroke of luck and keeps moving.",
  "{name} adds {item} to what little they started with.",
  "{name} claims {item} before anyone else even notices there's something to claim.",
  "{Item} turns out to be worth the detour. {name} isn't complaining.",
  "{name} pockets {item}, glad of one thing today that didn't have to be fought for.",
  "{name} finds {item} half-buried and walks away better armed than they arrived.",
  "{Item} — not much to look at, maybe, but {name} straps it on anyway.",
];
